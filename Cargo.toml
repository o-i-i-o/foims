[workspace]
members = [".", "crates/ipma-init", "crates/ipma-visualization", "crates/ipma-data-manager", "crates/ipma-scheduler"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Actix Web
actix-web = { version = "4.14.0" }
actix-multipart = "0.8.0"

# SQLx
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# CSV and ZIP
csv = "1.4.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Async
tokio = { version = "1.52.3", features = ["full"] }
futures-util = "0.3.32"

# Date/Time
chrono = { version = "0.4.45", features = ["serde"] }

# UUID
uuid = { version = "1.23.5", features = ["v4", "serde"] }

# Logging
tracing = "0.1.44"

# Crypto (AES)
aes-gcm = "0.11.0"
hex = "0.4.3"
base64 = "0.22.1"

# Error handling
thiserror = "2.0.18"

# Async trait
async-trait = "0.1.89"

# Cron scheduler
tokio-cron-scheduler = "0.15.1"

[package]
name = "ipma"
version = "0.13.1"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IP/MAC Address Management System based on Rust Actix-web and PostgreSQL"
license = "MIT"

[dependencies]
# Workspace crates
ipma-init = { path = "crates/ipma-init" }
ipma-visualization = { path = "crates/ipma-visualization" }
ipma-data-manager = { path = "crates/ipma-data-manager" }
ipma-scheduler = { path = "crates/ipma-scheduler" }

# Workspace dependencies (使用共享版本)
actix-web = { workspace = true }
actix-multipart = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
aes-gcm = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
csv = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# 主项目特有依赖
actix-files = "0.6.10"
actix-cors = "0.7.1"



regex = "1.13.0"

bcrypt = "0.19.2"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
sha2 = "0.11.0"
rand = "0.10.2"

tracing-subscriber = { version = "0.3.23", features = ["time", "local-time"] }

ipnetwork = "0.21.1"
macaddr = "1.0.1"
pnet = "0.35"

async-snmp = "0.13.0"

config = { version = "0.15.25", features = ["toml"] }
toml = "1.1.2"

anyhow = "1.0.103"
num_cpus = "1.17.0"
dashmap = "6.2.1"
arc-swap = "1.9.2"
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
totp-rs = { version = "5.7.2", features = ["qr", "gen_secret"] }


rust-i18n = "4.2.0"
time = "0.3.53"

[dev-dependencies]
actix-rt = "2.11.0"
tokio = { workspace = true }

[features]
default = []
