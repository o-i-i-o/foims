[workspace]
members = [".", "crates/ipma-common", "crates/ipma-init", "crates/ipma-visualization", "crates/ipma-data-manager", "crates/ipma-scheduler"]
resolver = "2"

[workspace.package]
edition = "2024"

# 与 AGENTS.md 硬性规范对应的 clippy 护栏（warn 级，CI 以 -D warnings 强制）：
# 禁止 unwrap/expect/调试输出/占位实现遗留，禁止用 #[allow] 压制告警
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
allow_attributes = "warn"

[workspace.dependencies]
# Axum
axum = { version = "0.8.9", features = ["macros", "multipart", "ws", "http2"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "compression-full", "trace", "fs", "set-header", "limit"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }

# SQLx
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Validation
validator = { version = "0.21.0", features = ["derive"] }

# CSV and ZIP
csv = "1.4.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Async
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"

# Date/Time
chrono = { version = "0.4.45", features = ["serde"] }

# UUID
uuid = { version = "1.24.0", features = ["v4", "serde"] }

# Logging
tracing = "0.1.44"

# Crypto (AES)
aes-gcm = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"

# Error handling
thiserror = "2.0.20"

# Async trait
async-trait = "0.1.92"

# Cron scheduler
tokio-cron-scheduler = "0.15.1"

[package]
name = "ipma"
version = "0.15.34"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IP/MAC Address Management System based on Rust Axum and PostgreSQL"
license = "MIT"

[dependencies]
# Workspace crates
ipma-common = { path = "crates/ipma-common" }
ipma-init = { path = "crates/ipma-init" }
ipma-visualization = { path = "crates/ipma-visualization" }
ipma-data-manager = { path = "crates/ipma-data-manager" }
ipma-scheduler = { path = "crates/ipma-scheduler" }

# Workspace dependencies (使用共享版本)
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
axum-extra = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
aes-gcm = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
csv = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# 主项目特有依赖

bcrypt = "0.19.3"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
sha2 = "0.11.0"
rand = "0.10.2"

tracing-subscriber = { version = "0.3.23", features = ["time", "local-time"] }

ipnetwork = "0.21.1"
macaddr = "1.0.1"
pnet = "0.35"

async-snmp = "0.17.0"

config = { version = "0.15.25", features = ["toml"] }
toml = "1.1.4"

dashmap = "6.2.1"
arc-swap = "1.9.2"
lettre = { version = "0.11.23", features = ["tokio1", "tokio1-native-tls"] }
totp-rs = { version = "6.0.0", features = ["qr", "gen_secret"] }


rust-i18n = "4.2.1"
time = "0.3.55"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []

