[package]
name = "foims"
version = "0.33.36"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS - Organization Infrastructure Management System based on Rust Axum and PostgreSQL"
license = "GPL-3.0-or-later"
[workspace]
members = [
    ".",
    "crates/foims-agent-service",
    "crates/foims-auth",
    "crates/foims-common",
    "crates/foims-data-management",
    "crates/foims-init",
    "crates/foims-models",
    "crates/foims-notify",
    "crates/foims-organization",
    "crates/foims-ipmi",
    "crates/foims-resource",
    "crates/foims-scheduler",
    "crates/foims-services",
    "crates/foims-snmp",
    "crates/foims-visualization",
    "crates/foims-x509-management",
]
resolver = "2"

[workspace.package]
edition = "2024"

# 与 AGENTS.md 硬性规范对应的护栏（warn 级，CI 以 -D warnings 强制）：
# clippy 禁止 unwrap/expect/调试输出/占位实现遗留，禁止用 #[allow] 压制告警；
# rust 层直接禁用 unsafe 代码（本仓库为零 unsafe 的纯安全实现）
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
allow_attributes = "warn"

[workspace.dependencies]

# Crypto (AES)
aes-gcm = "0.11.1"
arc-swap = "1.9.5"

# Async trait
async-trait = "0.1.92"
# Axum
axum = { version = "0.8.9", features = ["macros", "multipart", "ws", "http2"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"

# 密码哈希 / 随机数 / TOML 序列化 / 日志时间格式化（多 crate 共享）
bcrypt = "0.19.3"
# 正则（SNMP 厂商识别：descr_regexes / probe 值比对）
regex = "1.13.2"

# Date/Time
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.27", features = ["toml"] }

# CSV and ZIP
csv = "1.4.0"
dashmap = "6.2.1"
flate2 = "1.1.11"
hex = "0.4.3"

# 本机网卡地址枚举（agent-service 证书 SAN，纯安全封装 getifaddrs）
if-addrs = "0.15"

# 网络 / 哈希 / 并发表 / 配置加载（主程序与 foims-common 共享）
ipnetwork = "0.21.1"

# HMAC（钉钉 webhook 加签）
hmac = "0.13.0"

# JWT / 外部认证 / 邮件 / 2FA（主程序与 foims-auth 共享）
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
# SMTP 走 rustls（ring provider + webpki-roots），与全仓 rustls 栈统一；
# default-features = false 以剔除默认集中的 native-tls（否则 OpenSSL 仍会混入）
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls-tls"] }
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.10.4"

# Webhook 通知推送（钉钉/企业微信/通用）与 SSO OIDC 出站
# 与 oauth2/openidconnect 传递依赖的 reqwest 0.12 归并为单一版本（避免双 HTTP
# 栈与双 hyper 连接池）；rustls-tls-native-roots 经 __rustls-ring 为
# hyper-rustls/tokio-rustls/rustls 全链注入 ring（不引入 aws-lc-rs），信任源沿用
# 系统 CA（rustls-native-certs），与此前 0.13 rustls-platform-verifier 的系统信任
# 语义一致；ring 提供者仍由进程启动时显式安装（见 src/main.rs）
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Rust→TS 类型导出（前端 generated/ 由 cargo test export_bindings 生成）
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings", "chrono-impl", "uuid-impl", "serde-json-impl"] }
sha2 = "0.11.1"

# SQLx
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }

# deb 组包（foims-agent-service 分发下载：control/data tar + flate2 gzip）
tar = "0.4.46"

# Error handling
thiserror = "2.0.21"
time = "0.3.55"

# Async
tokio = { version = "1.54.1", features = ["full"] }
# SSE 流适配（broadcast → Stream，运行日志实时推送）
tokio-stream = { version = "0.1", features = ["sync"] }

# Cron scheduler
tokio-cron-scheduler = "0.15.1"
toml = "1.2.1"
totp-rs = { version = "6.0.0", features = ["qr", "gen_secret"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-full", "trace", "set-header", "limit"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# RPM 组包（foims-agent-service 分发下载；免 rpmbuild，不签名故裁掉 pgp）
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression"] }

# HTTP/3 / QUIC（foims-agent mTLS 上报）
bytes = "1.12.2"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
quinn = { version = "0.11.12", default-features = false, features = ["log", "rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std"] }

# UUID
uuid = { version = "1.29.3", features = ["v4", "serde"] }

# Validation
validator = { version = "0.21.0", features = ["derive"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }

# x509 证书解析（foims-common 证书剩余寿命辅助：agent 续期链路共用）
x509-parser = "0.18.1"

[features]
default = []

[dependencies]
async-trait = { workspace = true }
tokio-stream = { workspace = true }

# Workspace dependencies (使用共享版本)
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
foims-auth = { path = "crates/foims-auth" }
foims-agent-service = { path = "crates/foims-agent-service" }
# Workspace crates
foims-common = { path = "crates/foims-common" }
foims-data-management = { path = "crates/foims-data-management" }
foims-init = { path = "crates/foims-init" }
foims-models = { path = "crates/foims-models" }
foims-notify = { path = "crates/foims-notify" }
foims-organization = { path = "crates/foims-organization" }
foims-ipmi = { path = "crates/foims-ipmi" }
foims-resource = { path = "crates/foims-resource" }
foims-scheduler = { path = "crates/foims-scheduler" }
foims-services = { path = "crates/foims-services" }
foims-snmp = { path = "crates/foims-snmp" }
foims-visualization = { path = "crates/foims-visualization" }
foims-x509-management = { path = "crates/foims-x509-management" }

rust-i18n = "4.2.4"
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
ts-rs = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
# 主程序特有依赖

tracing-subscriber = { workspace = true, features = ["time", "local-time"] }
uuid = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
regex = "1.13.2"

[lints]
workspace = true
