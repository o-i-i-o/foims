
[package]
name = "foims"
version = "0.21.21"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS - Organization Infrastructure Management System based on Rust Axum and PostgreSQL"
license = "GPL-3.0-or-later"
[workspace]
members = [
    ".",
    "crates/foims-agent",
    "crates/foims-agent-service",
    "crates/foims-auth",
    "crates/foims-common",
    "crates/foims-data-management",
    "crates/foims-init",
    "crates/foims-models",
    "crates/foims-organization",
    "crates/foims-resource",
    "crates/foims-scheduler",
    "crates/foims-services",
    "crates/foims-visualization",
    "crates/foims-x509-management",
]
resolver = "2"

[workspace.package]
edition = "2024"

# 与 AGENTS.md 硬性规范对应的护栏（warn 级，CI 以 -D warnings 强制）：
# clippy 禁止 unwrap/expect/调试输出/占位实现遗留，禁止用 #[allow] 压制告警；
# rust 层直接禁用 unsafe 代码（本仓库为零 unsafe 的纯安全实现）
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
allow_attributes = "warn"

[workspace.dependencies]

# Crypto (AES)
aes-gcm = "0.11.1"
arc-swap = "1.9.2"

# Async trait
async-trait = "0.1.92"
# Axum
axum = { version = "0.8.9", features = ["macros", "multipart", "ws", "http2"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"

# 密码哈希 / 随机数 / TOML 序列化 / 日志时间格式化（多 crate 共享）
bcrypt = "0.19.3"

# Date/Time
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.27", features = ["toml"] }

# CSV and ZIP
csv = "1.4.0"
dashmap = "6.2.1"
flate2 = "1.1.10"
hex = "0.4.3"

# 网络 / 哈希 / 并发表 / 配置加载（主程序与 foims-common 共享）
ipnetwork = "0.21.1"

# JWT / 外部认证 / 邮件 / 2FA（主程序与 foims-auth 共享）
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
lettre = { version = "0.11.23", features = ["tokio1", "tokio1-native-tls"] }
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.10.3"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

# SQLx
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }

# deb 组包（foims-agent-service 分发下载：control/data tar + flate2 gzip）
tar = "0.4.46"

# Error handling
thiserror = "2.0.21"
time = "0.3.55"

# Async
tokio = { version = "1.53.2", features = ["full"] }

# Cron scheduler
tokio-cron-scheduler = "0.15.1"
toml = "1.1.6"
totp-rs = { version = "6.0.0", features = ["qr", "gen_secret"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-full", "trace", "set-header", "limit"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# 系统调用安全封装（foims-agent：statfs/uname/page_size 等，零 unsafe）
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "system", "process", "param"] }

# RPM 组包（foims-agent-service 分发下载；免 rpmbuild，不签名故裁掉 pgp）
rpm = { version = "0.29.0", default-features = false, features = ["payload", "gzip-compression"] }

# semver 版本门控（agent 产物 manifest 与主程序版本比较）
semver = "1.0.28"

# HTTP/3 / QUIC（foims-agent mTLS 上报 demo 与后续正式实施共享；h3 处于 0.0.x，锁定小版本）
bytes = "1.12.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
quinn = { version = "0.11.12", default-features = false, features = ["log", "rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
rustls-pemfile = "2.2.0"

# UUID
uuid = { version = "1.27.0", features = ["v4", "serde"] }

# Validation
validator = { version = "0.21.0", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = []

[dependencies]
async-trait = { workspace = true }

# Workspace dependencies (使用共享版本)
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
foims-auth = { path = "crates/foims-auth" }
foims-agent-service = { path = "crates/foims-agent-service" }
# Workspace crates
foims-common = { path = "crates/foims-common" }
foims-data-management = { path = "crates/foims-data-management" }
foims-init = { path = "crates/foims-init" }
foims-models = { path = "crates/foims-models" }
foims-organization = { path = "crates/foims-organization" }
foims-resource = { path = "crates/foims-resource" }
foims-scheduler = { path = "crates/foims-scheduler" }
foims-services = { path = "crates/foims-services" }
foims-visualization = { path = "crates/foims-visualization" }
foims-x509-management = { path = "crates/foims-x509-management" }

rust-i18n = "4.2.4"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
# 主程序特有依赖

tracing-subscriber = { workspace = true, features = ["time", "local-time"] }
uuid = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
regex = "1"

[lints]
workspace = true
