# IPMA 应用层 Fail2ban Jail 配置
#
# 安装方法：
#   sudo cp ipma-jail.conf /etc/fail2ban/jail.d/ipma.conf
#   sudo systemctl restart fail2ban
#
# 前置条件：
#   1. 已安装 fail2ban: sudo apt install fail2ban
#   2. 已安装过滤器: sudo cp ipma-auth.conf /etc/fail2ban/filter.d/ipma-auth.conf
#   3. IPMA 应用层 fail2ban 已启用并写入 /var/log/ipma/auth.log
#
# 说明：
#   - IPMA 应用层 fail2ban 与 OS fail2ban 各自独立工作，互不干扰
#   - 应用层 fail2ban 在内存中即时封禁（重启后失效）
#   - OS fail2ban 通过监控 auth.log 提供 OS 级封禁（使用 iptables/nftables，重启后仍生效）
#   - 两者叠加可提供更稳健的爆破防护

[ipma-auth]
enabled  = true
filter   = ipma-auth
logpath  = /var/log/ipma/auth.log
backend  = polling
maxretry = 5
findtime = 600
bantime  = 3600
action   = %(action_)s
