# FOIMS 应用层 Fail2ban 认证日志过滤器
#
# 安装方法：
#   sudo cp foims-auth.conf /etc/fail2ban/filter.d/foims-auth.conf
#
# 配套 jail 配置见同目录 foims-jail.conf
#
# 日志格式（由 FOIMS 应用层 fail2ban 写入 /var/log/foims/auth.log）：
#   2026-07-17T12:00:00Z [FAIL] 192.168.1.100 - user: admin - Invalid password
#   2026-07-17T12:00:00Z [OK] 192.168.1.100 - user: admin
#
# 匹配规则：捕获所有 [FAIL] 行的客户端 IP

[INCLUDES]
before = common.conf

[Definition]
# 解析日志行，提取 <HOST>
_daemon = foims-auth
failregex = ^\[FAIL\] <HOST> -.*
ignoreregex =

[Init]
# 时间戳格式：ISO 8601 UTC
datepattern = %%Y-%%m-%%dT%%H:%%M:%%SZ
