# IPMA Nginx 生产配置（HTTPS）
#
# 使用方式：
#   1. 复制到 /etc/nginx/sites-available/ipma.conf (或 /etc/nginx/conf.d/ipma.conf)
#   2. 修改 server_name、$web_dir 路径、SSL 证书路径为实际值
#   3. 创建符号链接：ln -s /etc/nginx/sites-available/ipma.conf /etc/nginx/sites-enabled/(可选)
#   4. nginx -t 测试配置
#   5. systemctl reload nginx
#
# 前置条件：
#   - IPMA 后端以 UDS 模式运行（config.toml [server.listen] uds_path 配置）
#   - axum 通过 systemd 启动（或手动启动）
#   - 静态文件已部署到 web_dir 路径
#   - nginx 用户（通常 www-data）能访问 socket 和静态文件
#   - nginx >= 1.25.1（支持 proxy_http_version 2.0 h2c 上游）
#   - TLS 证书由 certbot 或自签名生成
#
# 调试模式请使用 ipma-dev.conf

# 后端 upstream（UDS + h2c 模式）
upstream ipma_backend {
    # socket 路径需与 config.toml [server.listen] uds_path 一致
    server unix:/run/ipma/api.sock;
    # 连接复用：HTTP/2 多路复用，消除每次请求的握手开销
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# 速率限制 zone（需在 http{} 块启用，此处供 location 引用）
# limit_req_zone $binary_remote_addr zone=ipma_api:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=ipma_auth:10m rate=5r/s;

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # ACME challenge（certbot 申请证书时使用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # TLS 证书（推荐 certbot 自动管理）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（原 axum security_headers 中间件，生产模式由 nginx 设置）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $web_dir /usr/share/ipma/web;

    # 根路径跳转到主页面
    location = / {
        return 302 /static/index.html;
    }

    # main.html 直接服务
    location = /main.html {
        alias $web_dir/static/main.html;
        default_type text/html;
    }

    # init_index.html（初始化模式）
    location = /init_index.html {
        alias $web_dir/static/init_index.html;
        default_type text/html;
    }

    # 静态文件（前端 JS/CSS/图片）
    # 长缓存策略，配合 ETag 实现版本控制
    location /static/ {
        alias $web_dir/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        etag on;
        try_files $uri =404;
    }

    # 初始化接口：仅允许本地访问（纵深防御）
    # 后端 localhost_only_middleware 亦基于 X-Real-IP 做同款限制；
    # 此处由 nginx 直接拦截非本地请求，避免后端保护被绕过。
    # 如需从内网其它主机初始化，可在此追加 allow <内网网段>; （但不建议开放到公网）。
    # 注意：前缀写 /api/init（无尾斜杠），同时匹配 /api/init、/api/init/db/create 等子路径，
    #       避免对无尾斜杠的 /api/init 触发 301 重定向（会导致 POST→GET / body 丢失）。
    location /api/init {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://ipma_backend;
        proxy_http_version 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    # API 反向代理到 axum UDS（h2c）
    location /api/ {
        proxy_pass http://ipma_backend;

        # h2c：HTTP/2 cleartext，多路复用 + keepalive
        proxy_http_version 2;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # 缓冲（保护后端不被慢客户端拖累）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 超时（适配 SNMP 长耗时请求）
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小（适配 CSV/ZIP 导入）
        client_max_body_size 50m;
    }

    # 健康检查
    location = /health {
        proxy_pass http://ipma_backend/health;
        proxy_http_version 2;
        access_log off;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
