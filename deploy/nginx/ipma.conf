# IPMA Nginx 配置模板
#
# 使用方式：
#   1. 复制到 /etc/nginx/sites-available/ipma.conf
#   2. 修改 server_name、web_dir 路径、SSL 证书路径为实际值
#   3. 创建符号链接：ln -s /etc/nginx/sites-available/ipma.conf /etc/nginx/sites-enabled/
#   4. nginx -t 测试配置
#   5. systemctl reload nginx
#
# 前置条件：
#   - IPMA 后端以 UDS 模式运行（config.toml [server.listen] uds_path 配置）
#   - axum 手动启动或通过 systemd 启动
#   - 静态文件已部署到 web_dir 路径
#   - nginx 用户（通常 www-data）能访问 socket 和静态文件
#
# 调试模式（HTTP only）：
#   - 启用下方 [调试模式] 段，注释 [生产模式] 段
#   - 仅监听 80 端口，无 TLS
#   - axum 可手动启动：sudo IPMA_WEB_DIR=/path/to/web ./target/release/ipma
#
# 生产模式（HTTPS）：
#   - 启用下方 [生产模式] 段，注释 [调试模式] 段
#   - 监听 443 端口，TLS 证书由 certbot 或自签名生成
#   - 80 端口仅作 HTTP→HTTPS 跳转

# 后端 upstream（UDS + h2c 模式）
upstream ipma_backend {
    # socket 路径需与 config.toml [server.listen] uds_path 一致
    # 调试：/tmp/ipma-dev.sock
    # 生产：/run/ipma/api.sock
    server unix:/tmp/ipma-dev.sock;
    # 连接复用：HTTP/2 多路复用，消除每次请求的握手开销
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# 速率限制 zone（需在 http{} 块启用，此处供 location 引用）
# limit_req_zone $binary_remote_addr zone=ipma_api:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=ipma_auth:10m rate=5r/s;

# === 调试模式（HTTP only，开发环境） ===
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 静态文件根目录（指向项目 web 目录或部署目录）
    # 开发环境：指向项目 /path/to/ipma/web/static
    # 生产环境：/usr/share/ipma/web/static 或 /opt/ipma/web/static
    set $web_dir /media/oi-io/AA709DF48A7AD5C2/ipma/web;

    # 根路径跳转到主页面
    location = / {
        return 302 /static/index.html;
    }

    # main.html 直接服务
    location = /main.html {
        alias $web_dir/static/main.html;
        default_type text/html;
    }

    # init_index.html（初始化模式）
    location = /init_index.html {
        alias $web_dir/static/init_index.html;
        default_type text/html;
    }

    # 静态文件（前端 JS/CSS/图片）
    # 长缓存策略，配合 ETag 实现版本控制
    location /static/ {
        alias $web_dir/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        etag on;
        try_files $uri =404;
    }

    # API 反向代理到 axum UDS（h2c）
    location /api/ {
        proxy_pass http://ipma_backend;

        # h2c：HTTP/2 cleartext，多路复用 + keepalive
        proxy_http_version 2.0;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 缓冲（保护后端不被慢客户端拖累）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 超时（适配 SNMP 长耗时请求）
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小（适配 CSV/ZIP 导入）
        client_max_body_size 50m;
    }

    # 健康检查
    location = /health {
        proxy_pass http://ipma_backend/health;
        proxy_http_version 2.0;
        access_log off;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

