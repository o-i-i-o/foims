# FOIMS Nginx 生产配置（HTTPS，自签名默认证书）
#
# 使用方式：
#   - DEB 包安装：本文件由包管理器安装到 /etc/nginx/conf.d/foims.conf
#     （conffile，升级时保留本地修改），postinst 自动生成默认证书并
#     nginx -t 校验后 reload
#   - 手动部署：复制到 /etc/nginx/conf.d/foims.conf，按需修改 server_name
#     与证书路径，nginx -t 测试后 systemctl reload nginx
#
# 前置条件：
#   - FOIMS 后端以 UDS 模式运行（config.toml [server.listen] uds_path 配置）
#   - 静态文件已部署到 /usr/share/foims/web（DEB 包布局）
#   - nginx 用户（通常 www-data）能访问 socket 和静态文件
#   - nginx >= 1.28.1（支持 proxy_http_version 2.0 h2c 上游与 HTTP/3）
#   - TLS 证书：默认由 deb postinst 用 openssl 在安装时自签生成
#     （安装时生成避免包内证书过期；已存在且未过期则跳过）；
#     后续可在系统「证书管理」页签发新证书并应用（会替换本文件的
#     ssl_certificate 路径），或改用 certbot 等公网证书

# 后端 upstream（UDS + h2c 模式）
upstream foims_backend {
    # socket 路径需与 config.toml [server.listen] uds_path 一致
    server unix:/run/foims/api.sock;
    # 连接复用：HTTP/2 多路复用，消除每次请求的握手开销
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# 速率限制 zone（需在 http{} 块启用，此处供 location 引用）
# limit_req_zone $binary_remote_addr zone=foims_api:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=foims_auth:10m rate=5r/s;

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    # "_"：不限定主机名（自签名证书场景按 IP/任意主机名访问均可）
    server_name _;

    # ACME challenge（certbot 申请证书时使用；自签名场景保留不影响）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/3 (QUIC)：nginx >= 1.25.1 正式支持；同一证书同时服务 TCP-TLS 与 QUIC，
    # 证书需包含 SAN（QUIC 主机名校验与 TLS 一致，忽略 CN）。
    # 注意：私有 CA 场景下 Chrome 不对 QUIC 使用本地信任锚，会自动回退 TCP，
    # Firefox 不受影响；如无需 HTTP/3 可删除 quic 监听与 Alt-Svc 两行。
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name _;

    # 通告 HTTP/3 端口（h3 协商需 UDP 443 防火墙放行）
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # TLS 证书：postinst 安装时自签生成的默认证书（固定文件名）。
    # 证书为公开物料、私钥 0600 仅属主（nginx master 以 root 读取）；
    # 替换证书请在系统「证书管理」页操作（自动改写本文件的以下两行）
    ssl_certificate     /etc/ssl/foims-certs/default_cert.pem;
    ssl_certificate_key /etc/ssl/foims-certs/default_cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 关闭会话票据：票据密钥长期不变会破坏前向保密（自签名场景无票据
    # 分发基础设施，直接禁用最稳妥）
    ssl_session_tickets off;

    # 安全响应头（原 axum security_headers 中间件，生产模式由 nginx 设置）。
    # 注意：nginx 的 add_header 继承语义——location 内出现任何 add_header
    # 即丢弃 server 级继承；下方带 Cache-Control 的 location 已逐项重申
    # 安全头，调整此处时需同步检查。
    #
    # HSTS：不含 preload——内网系统不建议进入浏览器 preload 清单
    #（进入后移除极其困难，且按 IP 访问时 HSTS 不生效）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP：与前端页面 <meta http-equiv="Content-Security-Policy"> 完全同源，
    # 并追加 frame-ancestors（meta 版无法表达该指令，由响应头补齐）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    # X-Frame-Options 与 CSP frame-ancestors 并存：为不支持 CSP 指令的
    # 旧浏览器保留兜底
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 权限策略：管理类系统不使用摄像头/麦克风/地理位置等 Web 能力
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    set $web_dir /usr/share/foims/web;

    # 根路径跳转到主页面
    location = / {
        return 302 /index.html;
    }

    # index.html（登录页面）
    # 各页面/静态 location 的 add_header（Cache-Control）会切断上方安全头
    # 继承，故逐项重申（与 server 级完全同口径）
    location = /index.html {
        alias $web_dir/index.html;
        default_type text/html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store" always;
        expires off;
    }

    # main.html 直接服务
    # 页面内引用带 ?v= 版本号的资源，版本号变更需即时生效，禁止缓存
    location = /main.html {
        alias $web_dir/static/main.html;
        default_type text/html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # init_index.html（初始化模式）
    location = /init_index.html {
        alias $web_dir/static/init_index.html;
        default_type text/html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-store" always;
        expires off;
    }

    # JS 模块：ES 模块之间以无版本号的相对路径互相导入（main.html 的 ?v=
    # 只覆盖入口模块），必须允许重验证（ETag 命中返回 304，开销极低），
    # 否则 utils 等被依赖模块更新后，老用户会持续命中本地过期缓存。
    location /static/js/ {
        alias $web_dir/static/js/;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
        etag on;
        try_files $uri =404;
    }

    # 其余静态资源（CSS/字体/图片）：入口引用均带 ?v= 版本参数，可长缓存
    location /static/ {
        alias $web_dir/static/;
        expires 1y;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "public, immutable";
        etag on;
        try_files $uri =404;
    }

    # 初始化接口：仅允许本地访问（纵深防御）
    # 后端 localhost_only_middleware 亦基于 X-Real-IP 做同款限制；
    # 此处由 nginx 直接拦截非本地请求，避免后端保护被绕过。
    # 如需从内网其它主机初始化，可在此追加 allow <内网网段>; （但不建议开放到公网）。
    # 注意：前缀写 /api/init（无尾斜杠），同时匹配 /api/init、/api/init/db/create 等子路径，
    #       避免对无尾斜杠的 /api/init 触发 301 重定向（会导致 POST→GET / body 丢失）。
    location /api/init {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://foims_backend;
        proxy_http_version 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    # API 反向代理到 axum UDS（h2c）
    location /api/ {
        proxy_pass http://foims_backend;

        # h2c：HTTP/2 cleartext，多路复用 + keepalive
        proxy_http_version 2;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # 缓冲（保护后端不被慢客户端拖累）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 超时（适配 SNMP 长耗时请求）
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小（适配 CSV/ZIP 导入）
        client_max_body_size 50m;
    }

    # 健康检查
    location = /health {
        proxy_pass http://foims_backend/health;
        proxy_http_version 2;
        access_log off;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
