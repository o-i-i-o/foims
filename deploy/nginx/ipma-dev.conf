# IPMA Nginx 调试模式配置（HTTP only，开发环境）
#
# 使用方式：
#   1. 复制到 /etc/nginx/sites-available/ipma-dev.conf (或 /etc/nginx/conf.d/ipma-dev.conf)
#   2. 修改 $web_dir 路径为实际值
#   3. nginx -t 测试配置
#   4. systemctl reload nginx
#
# 前置条件：
#   - IPMA 后端以 UDS 模式运行（config.toml [server.listen] uds_path 配置）
#   - axum 手动启动：sudo IPMA_WEB_DIR=/path/to/web ./target/release/ipma
#   - 静态文件已部署到 web_dir 路径
#   - nginx 用户（通常 www-data）能访问 socket 和静态文件
#   - nginx >= 1.25.1（支持 proxy_http_version 2.0 h2c 上游）

# 后端 upstream（UDS + h2c 模式）
upstream ipma_backend {
    # socket 路径需与 config.toml [server.listen] uds_path 一致
    server unix:/tmp/ipma-dev.sock;
    # 连接复用：HTTP/2 多路复用，消除每次请求的握手开销
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 300s;
}

# 速率限制 zone（需在 http{} 块启用，此处供 location 引用）
# limit_req_zone $binary_remote_addr zone=ipma_api:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=ipma_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 静态文件根目录（指向项目 web 目录或部署目录）
    # 开发环境：指向项目 /path/to/ipma/web/static
    # 生产环境：/usr/share/ipma/web/static 或 /opt/ipma/web/static
    set $web_dir /media/oi-io/AA709DF48A7AD5C2/ipma/web;

    # 根路径跳转到主页面
    location = / {
        return 302 /index.html;
    }

     #index.html（登录页面）
location = /index.html {
        alias $web_dir/static/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }


    # 开发环境：    # main.html 直接服务
    # 开发环境：不缓存，确保入口文档始终最新
    location = /main.html {
        alias $web_dir/static/main.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # init_index.html（初始化模式）
    # 开发环境：不缓存
    location = /init_index.html {
        alias $web_dir/static/init_index.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # 静态文件（前端 JS/CSS/图片）
    # 开发环境：禁用缓存，确保每次请求都获取最新文件（避免改了前端不生效）
    # 生产环境请改回长缓存：expires 1y; add_header Cache-Control "public, immutable";
    location /static/ {
        alias $web_dir/static/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        etag on;
        try_files $uri =404;
    }

    # 初始化接口：仅允许本地访问（纵深防御）
    # 后端 localhost_only_middleware 亦基于 X-Real-IP 做同款限制；
    # 此处由 nginx 直接拦截非本地请求，避免后端保护被绕过。
    # 如需从内网其它主机初始化，可在此追加 allow <内网网段>; （但不建议开放到公网）。
    # 注意：前缀写 /api/init（无尾斜杠），同时匹配 /api/init、/api/init/db/create 等子路径，
    #       避免对无尾斜杠的 /api/init 触发 301 重定向（会导致 POST→GET / body 丢失）。
    location /api/init {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://ipma_backend;
        proxy_http_version 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API 反向代理到 axum UDS（h2c）
    location /api/ {
        proxy_pass http://ipma_backend;

        # h2c：HTTP/2 cleartext，多路复用 + keepalive
        proxy_http_version 2;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 缓冲（保护后端不被慢客户端拖累）
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 超时（适配 SNMP 长耗时请求）
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 请求体大小（适配 CSV/ZIP 导入）
        client_max_body_size 50m;
    }

    # 健康检查
    location = /health {
        proxy_pass http://ipma_backend/health;
        proxy_http_version 2;
        access_log off;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
