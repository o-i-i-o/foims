[package]
name = "foims-agent"
version = "0.1.5"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS Agent - node_exporter 的 Rust 重写：主机指标采集 + HTTP/3 mTLS 上报 + 文本/JSON 输出"
license = "GPL-3.0-or-later"

[dependencies]
# HTTP/3 mTLS 上报链路（quinn+rustls-ring 纯用户态，musl 静态友好，无 OpenSSL）
bytes = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
# 上报协议共享类型（AgentReport/ReportResponse，唯一权威定义在 foims-common）
foims-common = { path = "../foims-common" }

# RFC3339 时刻（collected_at）
chrono = { workspace = true }
# 上报间隔 ±10% 抖动与 machine-id 随机回退
rand = { workspace = true }
# machine-id 兜底生成
uuid = { workspace = true }
# agent.toml 配置解析
toml = { workspace = true }

serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 系统调用安全封装：filesystem 采集器 statfs、uname 采集器 uname（crate 内零 unsafe）
rustix = { workspace = true }

[dev-dependencies]
# 续期落盘校验测试自签证书（与 foims-common 同版本）
rcgen = "0.14"

[lints]
workspace = true
