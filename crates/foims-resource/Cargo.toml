[package]
name = "foims-resource"
version = "0.1.12"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS Resource - networks, rooms, cabinets, workstations, devices, IPs, cable links"
license = "GPL-3.0-or-later"

[dependencies]
# Workspace crates
foims-common = { path = "../foims-common" }
foims-models = { path = "../foims-models" }
foims-auth = { path = "../foims-auth" }
# SNMP 域（协议层/采集/事件通知），依赖方向：本 crate → foims-snmp
foims-snmp = { path = "../foims-snmp" }

# Axum
axum = { workspace = true }

# SQLx
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# TS 类型导出
ts-rs = { workspace = true }

# Validation
validator = { workspace = true }

# Date/Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# 网络/CIDR 工具
ipnetwork = { workspace = true }

# 并发表（SNMP 同步任务去重）
dashmap = { workspace = true }

# SNMP 协议客户端已随域拆分迁至 foims-snmp（本 crate 经其 API 使用）

# Async
# （tokio::join 并行查询）
tokio = { workspace = true }

# 错误处理
thiserror = { workspace = true }

# 日志
tracing = { workspace = true }

[lints]
workspace = true
