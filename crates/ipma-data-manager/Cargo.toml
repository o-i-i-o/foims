[package]
name = "ipma-data-manager"
version = "0.1.0"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IPMA Data Management - CSV import/export and database backup functionality"
license = "MIT"

[dependencies]
# Actix Web
actix-web = { workspace = true }
actix-multipart = { workspace = true }

# SQLx
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation
validator = { workspace = true }

# CSV and ZIP
csv = { workspace = true }
zip = { workspace = true }

# Async
tokio = { workspace = true }
futures-util = { workspace = true }

# Date/Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = "2.0.18"

# Async trait
async-trait = { workspace = true }

# Crypto (for decrypting SNMP community in export)
aes-gcm = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }