[package]
name = "ipma-data-manager"
version = "0.1.1"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IPMA Data Management - CSV import/export and database backup functionality"
license = "GPL-3.0-or-later"

[dependencies]
# Workspace crates
ipma-common = { path = "../ipma-common" }

# Axum
axum = { workspace = true }

# SQLx
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation
validator = { workspace = true }

# CSV and ZIP
csv = { workspace = true }
zip = { workspace = true }

# Async
tokio = { workspace = true }

# Date/Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async trait
async-trait = { workspace = true }

# Crypto (for decrypting SNMP community in export)
aes-gcm = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
