[package]
name = "foims-agent-service"
version = "0.1.17"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS 数据采集服务：agent 分发打包与 QUIC mTLS 接收、SNMP 轮询/Trap 接收、证书签发续期"
license = "GPL-3.0-or-later"

[dependencies]
async-trait = { workspace = true }
async-snmp = "0.18.1"
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
flate2 = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
if-addrs = { workspace = true }
pem = "4"
quinn = { workspace = true }
rand = { workspace = true }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
rpm = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
time = { workspace = true }
ts-rs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

foims-auth = { path = "../foims-auth" }
foims-common = { path = "../foims-common" }
# SNMP 域（协议层/性能指标采集/事件通知）；域拆分后本 crate 不再依赖 foims-resource
foims-snmp = { path = "../foims-snmp" }
foims-scheduler = { path = "../foims-scheduler" }

[dev-dependencies]
# 无

[lints]
workspace = true
