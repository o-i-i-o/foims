[package]
name = "ipma-common"
version = "0.3.0"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IPMA Common - shared infra: responses, errors, config, crypto, db pool, net utils, rate limiting"
license = "GPL-3.0-or-later"

[dependencies]
# Axum
axum = { workspace = true }

# SQLx
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation
validator = { workspace = true }

# Async
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Crypto (AES) 与哈希/编码
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

# Error handling
thiserror = { workspace = true }

# 配置加载（TOML）
config = { workspace = true }

# 数据库连接池管理
arc-swap = { workspace = true }

# 限流并发表
dashmap = { workspace = true }

# 网络/CIDR 工具
ipnetwork = { workspace = true }

[lints]
workspace = true
