[package]
name = "ipma-visualization"
version = "0.1.0"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IPMA Visualization Module - Layout management and visualization"
license = "MIT"

[dependencies]
# Actix Web
actix-web = "4.13.0"

# SQLx PostgreSQL
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Utilities
uuid = { version = "1.23.3", features = ["v4", "serde"] }
tracing = "0.1.44"
thiserror = "2.0.18"