[package]
name = "ipma-visualization"
version = "0.1.0"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IPMA Visualization Module - Layout management and visualization"
license = "MIT"

[dependencies]
# Axum
axum = { workspace = true }

# SQLx PostgreSQL
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Utilities
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tracing = "0.1.44"
thiserror = "2.0.20"
