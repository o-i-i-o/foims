[package]
name = "foims-snmp"
version = "0.1.2"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS SNMP 域：协议参数构造与鉴权、设备采集（系统信息/端口/LLDP/ARP/性能指标）、观测事件与站内通知"
license = "GPL-3.0-or-later"

[dependencies]
# SNMP 协议客户端（原寄居 foims-resource / foims-agent-service，随域拆分归口本 crate）
async-snmp = "0.18.1"

# Axum（SNMP 探测/信息采集 handler）
axum = { workspace = true }

# SQLx（配置只读查询与事件落库）
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Date/Time（性能指标状态时间戳）
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Async（UdpHandle 传输层）
tokio = { workspace = true }

# 错误处理
thiserror = { workspace = true }

# 日志
tracing = { workspace = true }

# Workspace crates（依赖方向：foims-resource / foims-agent-service → 本 crate，本 crate 不依赖二者）
foims-common = { path = "../foims-common" }
foims-models = { path = "../foims-models" }
foims-auth = { path = "../foims-auth" }

[lints]
workspace = true
