# 通用公共回退链（全局兜底层，docs/SNMP模块重构方案.md §5.5/§6.1）。
#
# generic 是保留 id：常驻注册表、无 matcher、不可停用、不参与 group 归属。
# 所有品牌族识别失败或候选 walk 为空时，最终回退到本文件的候选链。
# 候选按声明顺序尝试，walk 为空/不支持则继续下一条；require_caps 是平台
# 能力门控（Windows 等已知缺失的 MIB 族不空走），require_prev 表示候选
# 需要上一轮差值状态（秒级实时路径自动跳过）。

[[profile]]
id           = "generic"
kind         = "group"
brand        = "generic"
display_name = "通用"

# ── CPU：UCD 计数器差值（5 分钟趋势，net-snmp 主机优先口径）→
#    hrProcessorLoad（每核一行，pick=max）──
[profile.collect.cpu]
pick = "max"

[[profile.collect.cpu.candidate]]
require_caps = ["ucd_cpu"]
require_prev = true
kind         = "counters"

[[profile.collect.cpu.candidate]]
require_caps = ["hr_processor"]
[[profile.collect.cpu.candidate.column]]
oid       = "1.3.6.1.2.1.25.3.3.1.2"   # HOST-RESOURCES hrProcessorLoad
value     = "percent"

# ── 内存：UCD 标量（used = total − available，KB）→ hrStorage Ram 行 ──
#    可用量优先 memSysAvail(4.27, MemAvailable 口径)，回落 memAvailReal
#    (4.6, MemFree 口径)；hrStorage Ram 行 used 是 total−free 口径，仅在前者
#    不可用时兜底。
[[profile.collect.mem.candidate]]
require_caps = ["ucd_mem"]
kind         = "pool"
[[profile.collect.mem.candidate.field]]
role = "total"
oid  = "1.3.6.1.4.1.2021.4.5.0"        # memTotalReal
unit = "kb"
[[profile.collect.mem.candidate.field]]
role = "free"
oid  = "1.3.6.1.4.1.2021.4.27.0"       # memSysAvail（MemAvailable）
unit = "kb"

[[profile.collect.mem.candidate]]
require_caps = ["ucd_mem"]
kind         = "pool"
[[profile.collect.mem.candidate.field]]
role = "total"
oid  = "1.3.6.1.4.1.2021.4.5.0"        # memTotalReal
unit = "kb"
[[profile.collect.mem.candidate.field]]
role = "free"
oid  = "1.3.6.1.4.1.2021.4.6.0"        # memAvailReal（MemFree）
unit = "kb"

[[profile.collect.mem.candidate]]
require_caps = ["hr_storage"]
kind         = "storage"
hr_type      = "ram"

# ── 温度：ENTITY-SENSOR-MIB → LM-SENSORS-MIB（任一命中即止）──
[[profile.collect.temp.candidate]]
require_caps = ["entity_sensors"]
kind         = "entity_sensors"
sensor       = "temperature"

[[profile.collect.temp.candidate]]
require_caps = ["lm_sensors"]
[[profile.collect.temp.candidate.column]]
oid  = "1.3.6.1.4.1.2021.13.16.2.1.3"  # lmTempSensorsValue（毫摄氏度）
unit = "milli"

# ── 存储：hrStorageTable FixedDisk 行（本地磁盘，5 分钟趋势消费）──
[[profile.collect.storage.candidate]]
require_caps = ["hr_storage"]
kind         = "storage"
hr_type      = "fixed_disk"

# ── 传感器：ENTITY-SENSOR-MIB 全类型 → LM-SENSORS 温度 ──
[[profile.collect.sensors.candidate]]
require_caps = ["entity_sensors"]
kind         = "entity_sensors"

[[profile.collect.sensors.candidate]]
require_caps = ["lm_sensors"]
sensor       = "temperature"
[[profile.collect.sensors.candidate.column]]
oid  = "1.3.6.1.4.1.2021.13.16.2.1.3"  # lmTempSensorsValue（毫摄氏度）
unit = "milli"
