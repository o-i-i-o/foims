[package]
name = "ipma-init"
version = "0.1.0"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IPMA Init Module - Database initialization and management"
license = "MIT"

[dependencies]
# Axum
axum = { workspace = true }

# SQLx PostgreSQL
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Validation
validator = { version = "0.21.0", features = ["derive"] }

# Password hashing
bcrypt = "0.19.3"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
rand = "0.10.2"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
thiserror = "2.0.20"
