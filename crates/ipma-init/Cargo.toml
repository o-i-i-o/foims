[package]
name = "ipma-init"
version = "0.1.0"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "IPMA Init Module - Database initialization and management"
license = "MIT"

[dependencies]
# Actix Web
actix-web = "4.13.0"
actix-multipart = "0.7.2"

# SQLx PostgreSQL
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Password hashing
bcrypt = "0.19.1"

# Utilities
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
rand = "0.10.1"
tracing = "0.1.44"
tokio = { version = "1.52.3", features = ["full"] }
futures-util = "0.3.32"
toml = "1.1.2"
thiserror = "2.0.18"
