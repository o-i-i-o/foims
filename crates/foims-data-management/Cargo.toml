[package]
name = "foims-data-management"
version = "0.2.2"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS Data Management - module-based CSV import/export and database backup functionality"
license = "GPL-3.0-or-later"

[dependencies]
# Workspace crates
foims-common = { path = "../foims-common" }

# Axum
axum = { workspace = true }

# SQLx
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation
validator = { workspace = true }

# ZIP / CSV
zip = { workspace = true }
csv = { workspace = true }

# Async
tokio = { workspace = true }

# Date/Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Logging

# Error handling
thiserror = { workspace = true }

# Async trait
async-trait = { workspace = true }

[lints]
workspace = true
