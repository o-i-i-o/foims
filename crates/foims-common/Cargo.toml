[package]
name = "foims-common"
version = "0.3.5"
edition.workspace = true
authors = ["oi-io <boss@oi-io.cc>"]
description = "FOIMS Common - shared infra: responses, errors, config, crypto, db pool, net utils, rate limiting"
license = "GPL-3.0-or-later"

[dependencies]
# Axum
axum = { workspace = true }

# SQLx
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation
validator = { workspace = true }

# Async
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Crypto (AES) 与哈希/编码
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
bcrypt = { workspace = true }

# Error handling
thiserror = { workspace = true }

# 配置加载（TOML）
config = { workspace = true }

# 数据库连接池管理
arc-swap = { workspace = true }

# 限流并发表
dashmap = { workspace = true }

# 网络/CIDR 工具
ipnetwork = { workspace = true }

# x509 证书解析（证书剩余寿命解析，agent 续期链路 agent/服务端共用）
x509-parser = { workspace = true }

[dev-dependencies]
# 证书剩余寿命解析测试自签证书
rcgen = "0.14"
time = { workspace = true }

[lints]
workspace = true
