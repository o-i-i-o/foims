[database]
host = "localhost"
port = 5432
database = "ipma"
username = "postgres"
password = "admin123"
max_connections = 20
min_connections = 5
acquire_timeout_secs = 15
idle_timeout_secs = 60
max_lifetime_secs = 1800
query_timeout_secs = 30
slow_query_threshold_ms = 1000
health_check_interval_secs = 30

[server]
host = "0.0.0.0"
host_ipv6 = "::"
http_enabled = true
http_port = 80
https_enabled = true
https_port = 443
auto_https = true
http_version = "http2"
cert_type = "self_signed"
public_url = ""
page_timeout = 30
cors_allowed_origins = []

[jwt]
secret = "451#*jdhjhdfskdsHASDGJSAD256dgdfgs4dfs45werr2x"
access_token_expiry = "15m"
refresh_token_expiry = "7d"

[init]
enabled = false

[i18n]
default_language = "zh"
supported_languages = [
    "zh",
    "en",
]

[rate_limit]
ip_limit = 1000
user_limit = 200
login_limit = 5
window_secs = 60
email_limit = 5
email_window_secs = 3600
enabled = true

[snmp]
timeout_secs = 5
retries = 3
lldp_timeout_secs = 30
mac_scan_timeout_secs = 10
