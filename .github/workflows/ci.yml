name: CI

on:
  push:
    branches: [ "main", "master", "Dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "Dev" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 阻断级：ES 模块语法与 i18n JSON 解析校验（零配置，确定性结果）。
      # id/注册表/i18n 键/版本号一致性由 cargo test 的
      # tests/frontend_consistency.rs 覆盖（随下方 build job 运行）。
      - name: JS 模块语法校验
        working-directory: web
        run: |
          set -e
          count=0
          for f in $(find static/js -name '*.js'); do
            node --input-type=module --check < "$f"
            count=$((count+1))
          done
          echo "语法校验通过：$count 个 JS 文件"

      - name: i18n JSON 校验
        working-directory: web
        run: |
          set -e
          for f in static/i18n/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done

      # 阻断级：lint 栈（本地已全绿；格式归 prettier、代码质量归 eslint，
      # CSS 归 stylelint、HTML 归 htmlhint、纯工具函数归 jest —— 职责划分
      # 见 web/eslint.config.mjs 与 docs/code-style.md 3.6）
      - name: 安装 lint 依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: ESLint（代码质量 + import/sonarjs 插件）
        working-directory: web
        run: npx eslint static/js tests

      - name: Stylelint（CSS）
        working-directory: web
        run: npx stylelint "static/css/**/*.css"

      - name: HTMLHint（入口页与模态片段）
        working-directory: web
        run: |
          npx htmlhint "static/*.html" "static/modals/**/*.html"
          npx htmlhint "static/*.html" --rules='{"doctype-first":true,"html-lang-require":true,"title-require":true}'

      - name: Prettier 格式检查
        working-directory: web
        run: npx prettier --check static/js tests eslint.config.mjs jest.config.mjs babel.config.cjs

      - name: Jest 单元测试（纯工具模块）
        working-directory: web
        run: npx jest

      - name: Depcheck（依赖健康检查）
        working-directory: web
        run: npx depcheck

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # musl-tools 提供 x86_64 musl 的 musl-gcc（ring 的 cc-rs 按目标回退查找）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libpq-dev lintian musl-tools

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      # 仓库根即 Cargo workspace（members 含 crates/*），无需额外 workspaces 配置
      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --check

      - name: 运行 clippy 检查
        run: cargo clippy --release -- -D warnings

      - name: 运行测试
        run: cargo test --release

      - name: 构建项目
        run: cargo build --release --verbose

      # Agent 分发物料由 build-deb.sh 级联 build-agent.sh 编译：aarch64 musl
      # 依赖 musl.cc 交叉工具链（cc-rs 编译 ring 时按目标前缀查找编译器，
      # 缺失时报 ToolNotFound）。与 AGENT_TARGETS 默认值（x86_64,aarch64）
      # 对应，扩充构建目标时需同步补充对应架构工具链。不锁下载哈希：HTTPS
      # 传输 + tar 解包 + --version 校验兜底即可，避免上游工具链更新时因
      # 哈希失配阻断 CI；有意升级工具链时更新下方缓存 key 强制刷新即可。
      - name: 缓存 aarch64 musl 交叉工具链
        uses: actions/cache@v4
        id: muslcc
        with:
          path: /opt/musl-cross
          key: musl-cross-aarch64-20211123

      - name: 安装 aarch64 musl 交叉工具链
        if: steps.muslcc.outputs.cache-hit != 'true'
        run: |
          wget --timeout=60 --tries=3 -O /tmp/aarch64-linux-musl-cross.tgz https://musl.cc/aarch64-linux-musl-cross.tgz
          sudo mkdir -p /opt/musl-cross
          sudo chown "$(id -u):$(id -g)" /opt/musl-cross
          tar -xzf /tmp/aarch64-linux-musl-cross.tgz -C /opt/musl-cross

      - name: 校验交叉编译器可用
        run: /opt/musl-cross/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version | head -n1

      # 打包脚本 scripts/build-deb.sh 无需 root：产物输出至 target/foims_<版本>_<架构>.deb
      - name: 构建 DEB 安装包
        run: bash scripts/build-deb.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: foims-ubuntu-build
          path: |
            target/release/foims
            target/foims_*.deb
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # musl-tools 提供 x86_64 musl 的 musl-gcc（ring 的 cc-rs 按目标回退查找）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libpq-dev musl-tools

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 构建发布版本
        run: cargo build --release --verbose

      # Agent 分发物料由 build-deb.sh 级联 build-agent.sh 编译：aarch64 musl
      # 依赖 musl.cc 交叉工具链（cc-rs 编译 ring 时按目标前缀查找编译器，
      # 缺失时报 ToolNotFound）。与 AGENT_TARGETS 默认值（x86_64,aarch64）
      # 对应，扩充构建目标时需同步补充对应架构工具链。不锁下载哈希：HTTPS
      # 传输 + tar 解包 + --version 校验兜底即可，避免上游工具链更新时因
      # 哈希失配阻断 CI；有意升级工具链时更新下方缓存 key 强制刷新即可。
      - name: 缓存 aarch64 musl 交叉工具链
        uses: actions/cache@v4
        id: muslcc
        with:
          path: /opt/musl-cross
          key: musl-cross-aarch64-20211123

      - name: 安装 aarch64 musl 交叉工具链
        if: steps.muslcc.outputs.cache-hit != 'true'
        run: |
          wget --timeout=60 --tries=3 -O /tmp/aarch64-linux-musl-cross.tgz https://musl.cc/aarch64-linux-musl-cross.tgz
          sudo mkdir -p /opt/musl-cross
          sudo chown "$(id -u):$(id -g)" /opt/musl-cross
          tar -xzf /tmp/aarch64-linux-musl-cross.tgz -C /opt/musl-cross

      - name: 校验交叉编译器可用
        run: /opt/musl-cross/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version | head -n1

      - name: 构建 DEB 安装包
        run: bash scripts/build-deb.sh

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: 打包发布文件
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          ARCH=$(dpkg --print-architecture)
          tar -czf "foims_${VERSION}_${ARCH}.tar.gz" -C target/release foims

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            foims_*.tar.gz
            target/foims_*.deb
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
