name: CI

on:
  push:
    branches: [ "main", "master", "Dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "Dev" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 阻断级：ES 模块语法与 i18n JSON 解析校验（零配置，确定性结果）。
      # id/注册表/i18n 键/版本号一致性由 cargo test 的
      # tests/frontend_consistency.rs 覆盖（随下方 build job 运行）。
      - name: JS 模块语法校验
        working-directory: web
        run: |
          set -e
          count=0
          for f in $(find static/js -name '*.js'); do
            node --input-type=module --check < "$f"
            count=$((count+1))
          done
          echo "语法校验通过：$count 个 JS 文件"

      - name: i18n JSON 校验
        working-directory: web
        run: |
          set -e
          for f in static/i18n/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done

      # 阻断级：lint 栈（本地已全绿；格式归 prettier、代码质量归 eslint，
      # CSS 归 stylelint、HTML 归 htmlhint、纯工具函数归 jest —— 职责划分
      # 见 web/eslint.config.mjs 与 docs/code-style.md 3.6）
      - name: 安装 lint 依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: ESLint（代码质量 + import/sonarjs 插件）
        working-directory: web
        run: npx eslint static/js tests

      - name: Stylelint（CSS）
        working-directory: web
        run: npx stylelint "static/css/**/*.css"

      - name: HTMLHint（入口页与模态片段）
        working-directory: web
        run: |
          npx htmlhint "static/*.html" "static/modals/**/*.html"
          npx htmlhint "static/*.html" --rules='{"doctype-first":true,"html-lang-require":true,"title-require":true}'

      - name: Prettier 格式检查
        working-directory: web
        run: npx prettier --check static/js tests eslint.config.mjs jest.config.mjs babel.config.cjs

      - name: Jest 单元测试（纯工具模块）
        working-directory: web
        run: npx jest

      - name: Depcheck（依赖健康检查）
        working-directory: web
        run: npx depcheck

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # build-essential/pkg-config/libssl-dev/libpq-dev 为主程序构建依赖，
      # lintian 为 DEB 包检查；agent 交叉编译走 zig 后端（见下），无需 musl 工具链
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libpq-dev lintian

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      # 仓库根即 Cargo workspace（members 含 crates/*），无需额外 workspaces 配置
      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --check

      - name: 运行 clippy 检查
        run: cargo clippy --release -- -D warnings

      - name: 运行测试
        run: cargo test --release

      - name: 构建项目
        run: cargo build --release --verbose

      # Agent 分发物料由 build-deb.sh 级联主仓根下的独立工作空间
      # foims-agent/（随本仓检出）的 build-agent.sh 编译（AGENT_TARGETS
      # 默认 x86_64,aarch64）。交叉后端用 cargo-zigbuild：zig cc 兼任交叉 C
      # 编译器与链接器（ring 等依赖直接编），替代 musl.cc 工具链下载——该站点
      # 多次间歇不可达（v0.6.3/v0.7.2/v0.7.3 三轮修复仍失败），最终弃用。
      # zig 由 mlugg/setup-zig 官方社区 Action 安装（minisign 验签 + 多镜像
      # 回退 + 自动缓存，比 npm 方式更稳），锁精确版本 0.13.0（本地 e2e 已
      # 验证该版本与 ring 兼容，有意升级时同步更新版本号）；cargo-zigbuild
      # 走 crates.io 稳定版。均不锁哈希（与 v0.7.2 结论一致），功能正确性由
      # 下方 --version 校验与构建产物把关。
      - name: 安装 zig 交叉后端
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        run: |
          cargo install cargo-zigbuild --locked
          zig version
          cargo-zigbuild --version

      # 打包脚本 scripts/build-deb.sh 无需 root：产物输出至 target/foims_<版本>_<架构>.deb
      - name: 构建 DEB 安装包
        run: AGENT_BACKEND=zigbuild bash scripts/build-deb.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: foims-ubuntu-build
          path: |
            target/release/foims
            target/foims_*.deb
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # build-essential/pkg-config/libssl-dev/libpq-dev 为主程序构建依赖；
      # agent 交叉编译走 zig 后端（见下），无需 musl 工具链
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libpq-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 构建发布版本
        run: cargo build --release --verbose

      # Agent 分发物料由 build-deb.sh 级联主仓根下的独立工作空间
      # foims-agent/（随本仓检出）的 build-agent.sh 编译（AGENT_TARGETS
      # 默认 x86_64,aarch64）。交叉后端用 cargo-zigbuild：zig cc 兼任交叉 C
      # 编译器与链接器（ring 等依赖直接编），替代 musl.cc 工具链下载——该站点
      # 多次间歇不可达（v0.6.3/v0.7.2/v0.7.3 三轮修复仍失败），最终弃用。
      # zig 由 mlugg/setup-zig 官方社区 Action 安装（minisign 验签 + 多镜像
      # 回退 + 自动缓存，比 npm 方式更稳），锁精确版本 0.13.0（本地 e2e 已
      # 验证该版本与 ring 兼容，有意升级时同步更新版本号）；cargo-zigbuild
      # 走 crates.io 稳定版。均不锁哈希（与 v0.7.2 结论一致），功能正确性由
      # 下方 --version 校验与构建产物把关。
      - name: 安装 zig 交叉后端
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        run: |
          cargo install cargo-zigbuild --locked
          zig version
          cargo-zigbuild --version

      - name: 构建 DEB 安装包
        run: AGENT_BACKEND=zigbuild bash scripts/build-deb.sh

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: 打包发布文件
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          ARCH=$(dpkg --print-architecture)
          tar -czf "foims_${VERSION}_${ARCH}.tar.gz" -C target/release foims

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            foims_*.tar.gz
            target/foims_*.deb
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
