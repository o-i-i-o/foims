name: CI

on:
  push:
    # 全分支触发：避免开发分支（如 vue3-test）更名或新增后落入 fmt/clippy/test/ts-rs
    # 漂移校验的漏检窗口；保留 tag 触发以覆盖正式版发布
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "Dev" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 依赖安装：与 package-lock.json 严格一致（Vue 3 + Vite 工程）
      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # 阻断级：构建期集中暴露 SFC 编译错误、模板引用缺失与 import 断链
      - name: 前端构建
        working-directory: frontend
        run: npm run build

      # 阻断级：lint 栈（Biome 管 CSS 与格式、Oxlint 管 JS 质量，均为独立
      # 二进制脱离 Node 环境运行，配置见根 biome.json 与 .oxlintrc.json）。
      # 版本有意固定（不用 @latest：阻断门需
      # 可复现），三处联动：本文件 npx 版本、根 devDependencies、biome.json 的
      # $schema（文档命令示例同步）；升级统一走
      # da-scripts/upgrade-lint-tools.sh，自动改全部引用点并附探针验证
      - name: Biome（CSS + 格式检查）
        run: npx --yes @biomejs/biome@2.6.8 check frontend

      - name: Oxlint（JS 质量检查）
        run: npx --yes oxlint@1.94.0

      # 可视化纯函数自检（geometry/viewmodel，纯逻辑无浏览器依赖），
      # 与后端单测同源把关视图模型计算，防止纯函数层回归无人拦截
      - name: 可视化纯函数自检
        working-directory: frontend
        run: npm run selfcheck:viz

  # 主程序任务：检查（fmt/clippy/test）→ 编译 → deb / rpm / zip 产物。
  # Agent 随独立仓库 foims-agent（github.com/o-i-i-o/foims-agent，本地
  # clone 于主仓根并经 .gitignore 排除）自建 CI 构建发布，与本工作流解耦。
  #
  # matrix 双架构（x86_64 / aarch64，与 release.yml 同构）：aarch64 用
	# GitHub 原生 ARM runner，不走交叉编译——build-pkgs.sh 以
	# dpkg --print-architecture 自动得到 arm64/aarch64，放在 ARM runner
	# 上原生编译后，deb/rpm/zip 三种产物架构天然正确（全仓 TLS 统一
	# rustls，无 libssl 交叉链接问题）。
  # 检查门（fmt/clippy/test/TS 漂移）与架构无关，只在 x86_64 leg 执行一次，
  # aarch64 leg 仅编译打包，避免重复耗时。
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_checks: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            run_checks: false

    steps:
      - uses: actions/checkout@v4

      # build-essential/pkg-config 为主程序构建依赖；rpm/zip 供
      # build-pkgs.sh 打包，lintian 为 DEB 包检查。GitHub 镜像虽预装部分
      # 工具，但各架构镜像清单并不保证一致，显式声明避免 aarch64 leg 在
      # 打包阶段才失败（全仓 TLS 统一 rustls，Cargo.lock 无 openssl-sys，
      # 不需要 libssl-dev；sqlx postgres 为纯 Rust 协议实现，Cargo.lock
      # 无 pq-sys，不需要 libpq-dev）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config lintian rpm zip

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      # 仓库根即 Cargo workspace（members 含 crates/*），无需额外 workspaces
      # 配置；缓存键按架构区分，双 leg 不互相覆盖
      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: foims-build-${{ matrix.arch }}

      - name: 检查代码格式
        if: matrix.run_checks
        run: cargo fmt --check

      # --workspace --all-targets：覆盖各成员 crate 的 lib/bin/tests 全部目标，
      # 关闭旧命令（仅 root crate 默认目标）对成员 crate 的漏检窗口。
      # 各 crate 根 #![cfg_attr(test, allow(..))] 只豁免 crate 内部测试模块；
      # 若将来新增 tests/ 集成测试（独立 crate，不置 cfg(test)），其中仍禁止 unwrap/expect。
      # 生产代码在所有目标上均受 -D warnings 强约束
      - name: 运行 clippy 检查
        if: matrix.run_checks
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: 运行测试
        if: matrix.run_checks
        run: cargo test --release --workspace

      # ts-rs 类型生成物漂移校验：export_bindings 测试重跑后，
      # frontend/src/types/api/generated/ 不得产生与入库版本（git add -N
      # 使新增未跟踪文件也纳入 diff）不一致的差异
      - name: TS 类型生成物漂移校验
        if: matrix.run_checks
        run: |
          git add -N frontend/src/types/api/generated
          git diff --exit-code -- frontend/src/types/api/generated

      - name: 构建项目
        run: cargo build --release --verbose

      # 前端构建在打包脚本内现场执行（npm ci + vite build），需 Node 工具链
      - name: 安装 Node（打包脚本前端构建）
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 打包脚本 scripts/build-pkgs.sh 无需 root：deb（dpkg-deb）/rpm（rpmbuild
      # 用户态 _dbpath）/zip（裸二进制）三格式，产物输出至 target/；
      # 架构自动取 dpkg --print-architecture（ARM runner 即出 arm64/aarch64 包）
      - name: 构建主程序安装包（deb/rpm/zip）
        run: bash scripts/build-pkgs.sh

      # artifact 名带架构：upload-artifact v4 同名二次上传会直接失败
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: foims-release-${{ matrix.arch }}
          path: |
            target/foims_*.deb
            target/foims-*.rpm
            target/foims_*.zip
          retention-days: 30

  # 发布物来自主程序构建任务的双架构 artifact（deb/rpm/zip），本任务不重复构建
  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # artifact 内部为文件平铺（upload-artifact v4 以各 path 的公共祖先为
      # 根，target/ 目录层级不进 artifact），按目录落位后
      # files 用目录级通配，避免子路径 glob 落空静默丢产物；两个架构的
      # artifact 平铺进同一目录（包文件名含架构后缀，互不冲突）
      - name: 下载主程序构建产物（x86_64）
        uses: actions/download-artifact@v4
        with:
          name: foims-release-x86_64
          path: release-assets/main

      - name: 下载主程序构建产物（aarch64）
        uses: actions/download-artifact@v4
        with:
          name: foims-release-aarch64
          path: release-assets/main

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/main/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
