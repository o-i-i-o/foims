name: CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 阻断级：ES 模块语法与 i18n JSON 解析校验（零配置，确定性结果）。
      # id/注册表/i18n 键/版本号一致性由 cargo test 的
      # tests/frontend_consistency.rs 覆盖（随下方 build job 运行）。
      - name: JS 模块语法校验
        working-directory: web
        run: |
          set -e
          count=0
          for f in $(find static/js -name '*.js'); do
            node --input-type=module --check < "$f"
            count=$((count+1))
          done
          echo "语法校验通过：$count 个 JS 文件"

      - name: i18n JSON 校验
        working-directory: web
        run: |
          set -e
          for f in static/i18n/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done

      # 阻断级：lint 栈（本地已全绿；格式归 prettier、代码质量归 eslint，
      # CSS 归 stylelint、HTML 归 htmlhint、纯工具函数归 jest —— 职责划分
      # 见 web/eslint.config.mjs 与 docs/code-style.md 3.6）
      - name: 安装 lint 依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: ESLint（代码质量 + import/sonarjs 插件）
        working-directory: web
        run: npx eslint static/js tests

      - name: Stylelint（CSS）
        working-directory: web
        run: npx stylelint "static/css/**/*.css"

      - name: HTMLHint（入口页与模态片段）
        working-directory: web
        run: |
          npx htmlhint "static/*.html" "static/modals/**/*.html"
          npx htmlhint "static/*.html" --rules='{"doctype-first":true,"html-lang-require":true,"title-require":true}'

      - name: Prettier 格式检查
        working-directory: web
        run: npx prettier --check static/js tests eslint.config.mjs jest.config.mjs babel.config.cjs

      - name: Jest 单元测试（纯工具模块）
        working-directory: web
        run: npx jest

      - name: Depcheck（依赖健康检查）
        working-directory: web
        run: npx depcheck

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libpq-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ipma -> ./ipma

      - name: 检查代码格式
        run: cargo fmt --check

      - name: 运行 clippy 检查
        run: cargo clippy --release -- -D warnings

      - name: 运行测试
        run: cargo test --release

      - name: 构建项目
        run: cargo build --release --verbose

      - name: 构建 DEB 安装包
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ipma-ubuntu-build
          path: |
            target/release/ipma
            ipma_*.deb
          retention-days: 30

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libpq-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ipma -> ./ipma

      - name: 构建发布版本
        run: cargo build --release --verbose

      - name: 构建 DEB 安装包
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: 获取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: 打包发布文件
        run: |
          mkdir -p release
          cp ipma_*.deb release/
          cp target/release/ipma release/
          tar -czvf ipma-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz release/
          rm -rf release

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ipma-*.tar.gz
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
