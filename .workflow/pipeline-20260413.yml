stages:
  - check
  - build
  - release

variables:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

# 代码检查阶段
check_format:
  stage: check
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y build-essential pkg-config libssl-dev libpq-dev
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --check
  tags:
    - docker

run_clippy:
  stage: check
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y build-essential pkg-config libssl-dev libpq-dev
    - rustup component add rustfmt clippy
  script:
    - cargo clippy --release -- -D warnings
  tags:
    - docker

run_tests:
  stage: check
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y build-essential pkg-config libssl-dev libpq-dev
  script:
    - cargo test --release
  tags:
    - docker

# 构建阶段
build_release:
  stage: build
  image: rust:latest
  before_script:
    - apt-get update && apt-get install -y build-essential pkg-config libssl-dev libpq-dev
  script:
    - cargo build --release --verbose
    - chmod +x build-deb.sh
    - ./build-deb.sh
  artifacts:
    name: "ipma-build-$CI_COMMIT_REF_NAME"
    paths:
      - target/release/ipma
      - ipma_*.deb
    expire_in: 30 days
  tags:
    - docker
  only:
    - master
    - main
    - tags

# 发布阶段
create_release:
  stage: release
  image: registry.cn-shenzhen.aliyuncs.com/gitee-go/gitee-cli:latest
  before_script:
    - apt-get update && apt-get install -y build-essential pkg-config libssl-dev libpq-dev
  script:
    - |
      if [[ "$CI_COMMIT_TAG" =~ ^v[0-9]+\.[0-9]+ ]]; then
        VERSION=${CI_COMMIT_TAG#v}
        mkdir -p release
        cp ipma_*.deb release/ 2>/dev/null || true
        cp target/release/ipma release/ 2>/dev/null || true
        tar -czvf ipma-${VERSION}-linux-x64.tar.gz release/
        rm -rf release
        
        # 创建 Gitee Release
        gitee release create --tag-name "$CI_COMMIT_TAG" \
          --name "Release $CI_COMMIT_TAG" \
          --description "Release $CI_COMMIT_TAG" \
          --assets ipma-${VERSION}-linux-x64.tar.gz
      else
        echo "Not a version tag, skipping release"
      fi
  dependencies:
    - build_release
  tags:
    - docker
  only:
    - tags
