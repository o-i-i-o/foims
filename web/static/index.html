<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FOIMS系统登录页面">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <title>FOIMS - 系统登录</title>
    <link rel="stylesheet" href="/static/css/variables.css?v=01384">
    <link rel="stylesheet" href="/static/css/pages/login.css?v=01384">
    <link rel="stylesheet" href="/static/css/components/toasts.css?v=01384">
  </head>
  <!-- body 即文档主体，无需多余 role -->
  <body class="login-body">
    <div id="login-page">
      <!-- ============ 左面板（品牌 + 动画角色） ============ -->
      <div class="left-panel">

        <div class="characters-wrapper">
          <div class="characters-scene" id="characters-scene">
            <!-- 紫色角色（各部件初始坐标/尺寸收编到 login.css 的角色类中，数值与原内联样式一致） -->
            <div class="character char-purple" id="char-purple">
              <div class="eyes" id="purple-eyes">
                <div class="eyeball" id="purple-eye-l">
                  <div class="pupil" id="purple-pupil-l"></div>
                </div>
                <div class="eyeball" id="purple-eye-r">
                  <div class="pupil" id="purple-pupil-r"></div>
                </div>
              </div>
            </div>
            <!-- 黑色角色 -->
            <div class="character char-black" id="char-black">
              <div class="eyes" id="black-eyes">
                <div class="eyeball" id="black-eye-l">
                  <div class="pupil" id="black-pupil-l"></div>
                </div>
                <div class="eyeball" id="black-eye-r">
                  <div class="pupil" id="black-pupil-r"></div>
                </div>
              </div>
            </div>
            <!-- 橙色角色 -->
            <div class="character char-orange" id="char-orange">
              <div class="eyes" id="orange-eyes">
                <div class="bare-pupil" id="orange-pupil-l"></div>
                <div class="bare-pupil" id="orange-pupil-r"></div>
              </div>
              <div class="orange-mouth" id="orange-mouth"></div>
            </div>
            <!-- 黄色角色 -->
            <div class="character char-yellow" id="char-yellow">
              <div class="eyes" id="yellow-eyes">
                <div class="bare-pupil" id="yellow-pupil-l"></div>
                <div class="bare-pupil" id="yellow-pupil-r"></div>
              </div>
              <div class="yellow-mouth" id="yellow-mouth"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============ 右面板（表单） ============ -->
      <div class="right-panel">
        <div class="form-container">
          <div class="login-lang-switch">
            <select id="language-selector" aria-label="Select Language">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="brand-name">FOIMS</div>
          <div class="form-header">
            <h1 data-i18n="login.welcome">欢迎回来</h1>
            <p data-i18n="login.subtitle">请输入您的账号信息</p>
          </div>

          <!-- 登录模式 Tabs：用户名密码 / 邮箱验证码 / LDAP / SSO（LDAP 与 SSO 默认隐藏，
               由 /api/auth/methods 按配置开关显示） -->
          <div class="login-tabs" role="tablist">
            <button type="button" class="tab-btn active" data-tab="password-login" role="tab" aria-selected="true" aria-controls="password-login-section" data-i18n="login.password_auth">密码认证</button>
            <button type="button" class="tab-btn" data-tab="email-login" role="tab" aria-selected="false" aria-controls="email-login-section" data-i18n="login.email_auth">邮箱认证</button>
            <button type="button" class="tab-btn" data-tab="ldap-login" role="tab" aria-selected="false" aria-controls="ldap-login-section" data-i18n="login.ldap_auth" hidden>LDAP认证</button>
            <button type="button" class="tab-btn" data-tab="sso-login" role="tab" aria-selected="false" aria-controls="sso-login-section" data-i18n="login.sso_auth" hidden>SSO认证</button>
          </div>

          <!-- 视图容器 -->
          <div class="login-views">
            <!-- 登录视图（用户名密码 / 邮箱验证码） -->
            <div id="login-view" class="view active">
              <form id="login-form" aria-labelledby="login-heading">
                <h2 id="login-heading" class="sr-only" data-i18n="login.form_title">登录表单</h2>

                <!-- 用户名密码登录区域 -->
                <div id="password-login-section" class="login-section active">
                  <div class="form-group">
                    <label for="username" data-i18n="login.username_or_email">用户名或邮箱</label>
                    <div class="input-wrapper">
                      <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        aria-required="true"
                        placeholder="请输入用户名或邮箱"
                        data-i18n-placeholder="login.username_placeholder"
                        autocomplete="username"
                        aria-label="用户名或邮箱"
                        data-i18n-aria-label="login.username_or_email">
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="password" data-i18n="auth.password">密码</label>
                    <div class="input-wrapper">
                      <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        aria-required="true"
                        placeholder="请输入密码"
                        data-i18n-placeholder="login.password_placeholder"
                        autocomplete="current-password"
                        aria-label="密码"
                        data-i18n-aria-label="auth.password">
                      <button type="button" class="toggle-password" id="toggle-password" aria-label="显示或隐藏密码" data-i18n-aria-label="login.toggle_password">
                        <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                          <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- 与 eye-icon 互斥显示，由 JS 切换 hidden 属性 -->
                        <svg id="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                          <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <!-- 图形验证码（连续登录失败达到阈值后显示） -->
                  <div class="form-group" id="captcha-group" hidden>
                    <label for="captcha-input" data-i18n="login.captcha">验证码</label>
                    <div class="captcha-row">
                      <input
                        type="text"
                        id="captcha-input"
                        name="captcha_input"
                        maxlength="5"
                        autocomplete="off"
                        aria-label="验证码"
                        data-i18n-aria-label="login.captcha">
                      <button type="button" id="captcha-image" class="captcha-image" title="点击刷新验证码" data-i18n-title="login.captcha_refresh" aria-label="点击刷新验证码" data-i18n-aria-label="login.captcha_refresh"></button>
                    </div>
                  </div>
                </div>

                <!-- 邮箱验证码登录区域 -->
                <div id="email-login-section" class="login-section">
                  <div class="form-group">
                    <label for="email-login-input" data-i18n="auth.email">邮箱地址</label>
                    <div class="input-wrapper">
                      <input
                        type="email"
                        id="email-login-input"
                        name="email"
                        placeholder="请输入注册邮箱"
                        data-i18n-placeholder="login.email_placeholder"
                        autocomplete="email"
                        aria-label="邮箱地址"
                        data-i18n-aria-label="auth.email">
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="email-login-code" data-i18n="login.verify_code">验证码</label>
                    <div class="form-inline-group">
                      <input
                        type="text"
                        id="email-login-code"
                        name="email_code"
                        placeholder="请输入6位验证码"
                        data-i18n-placeholder="login.code_placeholder"
                        autocomplete="one-time-code"
                        aria-label="验证码"
                        data-i18n-aria-label="login.verify_code"
                        maxlength="6"
                        pattern="[0-9]{6}">
                      <button type="button" id="send-login-code-btn" class="btn-send-code" data-i18n="login.send_code">发送验证码</button>
                    </div>
                  </div>
                </div>

                <!-- LDAP 登录区域（使用 LDAP 目录账户） -->
                <div id="ldap-login-section" class="login-section">
                  <div class="form-group">
                    <label for="ldap-username" data-i18n="login.ldap_username">LDAP 用户名</label>
                    <div class="input-wrapper">
                      <input
                        type="text"
                        id="ldap-username"
                        name="ldap_username"
                        placeholder="请输入LDAP用户名"
                        data-i18n-placeholder="login.ldap_username_placeholder"
                        autocomplete="username"
                        aria-label="LDAP用户名"
                        data-i18n-aria-label="login.ldap_username">
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="ldap-password" data-i18n="auth.password">密码</label>
                    <div class="input-wrapper">
                      <input
                        type="password"
                        id="ldap-password"
                        name="ldap_password"
                        placeholder="请输入LDAP密码"
                        data-i18n-placeholder="login.ldap_password_placeholder"
                        autocomplete="current-password"
                        aria-label="密码"
                        data-i18n-aria-label="auth.password">
                    </div>
                  </div>

                  <!-- 图形验证码（连续登录失败达到阈值后显示） -->
                  <div class="form-group" id="ldap-captcha-group" hidden>
                    <label for="ldap-captcha-input" data-i18n="login.captcha">验证码</label>
                    <div class="captcha-row">
                      <input
                        type="text"
                        id="ldap-captcha-input"
                        name="ldap_captcha_input"
                        maxlength="5"
                        autocomplete="off"
                        aria-label="验证码"
                        data-i18n-aria-label="login.captcha">
                      <button type="button" id="ldap-captcha-image" class="captcha-image" title="点击刷新验证码" data-i18n-title="login.captcha_refresh" aria-label="点击刷新验证码" data-i18n-aria-label="login.captcha_refresh"></button>
                    </div>
                  </div>
                </div>

                <!-- SSO 登录区域（跳转 OIDC 认证平台） -->
                <div id="sso-login-section" class="login-section">
                  <div class="form-group">
                    <p class="hint-text" data-i18n="login.sso_hint">跳转到企业统一认证平台完成登录</p>
                  </div>
                </div>

                <!-- 主登录按钮（带 hover 滑动箭头） -->
                <button type="submit" id="login-submit-btn" class="btn-login" aria-label="登录" data-i18n-aria-label="login.sign_in">
                  <span class="btn-text" data-i18n="login.sign_in">登录</span>
                  <span class="btn-hover-content">
                    <span data-i18n="login.sign_in">登录</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="5" y1="12" x2="19" y2="12" />
                      <polyline points="12 5 19 12 12 19" />
                    </svg>
                  </span>
                </button>

                <!-- 保持登录 + 忘记密码（同一行） -->
                <div class="form-options">
                  <label class="remember-me">
                    <input type="checkbox" name="remember" id="remember-me" aria-label="保持登录" data-i18n-aria-label="login.remember_me">
                    <span data-i18n="login.remember_me">保持登录</span>
                  </label>
                  <!-- 原 div 模拟链接按钮化：.link-button 提供按钮 reset，.forgot-link 保留原链接视觉 -->
                  <button type="button" id="forgot-password-link" class="forgot-link link-button" data-i18n="login.forgot_password">忘记密码？</button>
                </div>
              </form>
            </div>

            <!-- 2FA 验证视图 -->
            <div id="two-factor-view" class="view">
              <div class="view-header">
                <h3 data-i18n="login.two_factor_title">双重验证</h3>
                <p class="view-desc" data-i18n="login.two_factor_desc">为了您的账户安全，请进行二次验证</p>
              </div>

              <form id="two-factor-form">
                <div class="form-group">
                  <label for="two-factor-code" data-i18n="login.verify_code">验证码</label>
                  <input
                    type="text"
                    id="two-factor-code"
                    name="two_factor_code"
                    placeholder="请输入6位验证码"
                    data-i18n-placeholder="login.code_placeholder"
                    autocomplete="one-time-code"
                    aria-label="验证码"
                    data-i18n-aria-label="login.verify_code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required>
                </div>

                <div class="form-group password-hint">
                  <small class="hint-text" data-i18n="login.two_factor_hint">请输入身份验证器生成的动态码</small>
                </div>

                <button type="submit" id="two-factor-submit-btn" class="btn-login">
                  <span class="btn-text" data-i18n="login.verify_and_sign_in">验证并登录</span>
                  <span class="btn-hover-content">
                    <span data-i18n="login.verify_and_sign_in">验证并登录</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="5" y1="12" x2="19" y2="12" />
                      <polyline points="12 5 19 12 12 19" />
                    </svg>
                  </span>
                </button>

                <button type="button" id="back-to-login-btn" class="btn-text-full" data-i18n="login.back_to_login">
                  返回账号登录
                </button>
              </form>
            </div>
          </div>

          <div id="login-error" class="error-message" role="alert" aria-live="polite"></div>

          <!-- 站点根证书下载入口：CA 证书是公开数据，登录前即可下载；
               无 CA 时整体隐藏 -->
          <div id="ca-download-entry" class="ca-download-entry" hidden>
            <a href="/api/certificate/ca/download" class="ca-download-link" download data-i18n="login.ca_download">下载本站根证书</a>
          </div>
        </div>
      </div>
    </div>

    

    <script type="module" src="/static/js/login.js?v=01384"></script>
  </body>
</html>
