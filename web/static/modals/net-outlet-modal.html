<template id="net-outlet-modal-template">
<div id="net-outlet-modal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="net-outlet-modal-title" data-i18n="net_outlet.add">Add Network Outlet</h3>
      <span class="close" data-modal-id="net-outlet-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <form id="net-outlet-form">
        <input type="hidden" id="net-outlet-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="net-outlet-name"><span data-i18n="net_outlet.name">Network Outlet Name</span><span class="required">*</span></label>
            <input type="text" id="net-outlet-name" name="name" autocomplete="off" required />
          </div>
          <div class="form-group">
            <label for="net-outlet-type"><span data-i18n="net_outlet.type">Type</span></label>
            <select id="net-outlet-type" name="outlet_type">
              <option value="wall_socket" data-i18n="net_outlet.type_wall_socket">Wall Socket</option>
              <option value="patch_panel" data-i18n="net_outlet.type_patch_panel">Patch Panel</option>
              <option value="wifi_ap" data-i18n="net_outlet.type_wifi_ap">WiFi AP</option>
              <option value="other" data-i18n="net_outlet.type_other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="net-outlet-room-id"><span data-i18n="net_outlet.room">Room</span><span class="required">*</span></label>
            <select id="net-outlet-room-id" name="room_id" required>
              <option value="" data-i18n="net_outlet.select_room">Select Room</option>
            </select>
          </div>
          <div class="form-group">
            <label for="net-outlet-cabinet-id" data-i18n="net_outlet.cabinet">Cabinet</label>
            <select id="net-outlet-cabinet-id" name="cabinet_id">
              <option value="" data-i18n="net_outlet.select_cabinet">Select Cabinet</option>
            </select>
          </div>
        </div>
        <hr class="form-divider" />
        <div class="form-row">
          <div class="form-group">
            <label for="net-outlet-peer-type"><span data-i18n="net_outlet.peer_type">Peer Type</span></label>
            <select id="net-outlet-peer-type" name="peer_type">
              <option value="" data-i18n="net_outlet.peer_type_none">None</option>
              <option value="outlet" data-i18n="net_outlet.peer_type_outlet">Outlet</option>
              <option value="device_port" data-i18n="net_outlet.peer_type_device_port">Device Port</option>
            </select>
          </div>
          <div class="form-group">
            <label for="net-outlet-peer-room-id"><span data-i18n="net_outlet.peer_room">Peer Room</span></label>
            <select id="net-outlet-peer-room-id" name="peer_room_id">
              <option value="" data-i18n="net_outlet.select_peer_room">Select Peer Room</option>
            </select>
          </div>
        </div>
        <div class="form-group" id="net-outlet-peer-outlet-group" style="display:none;">
          <label for="net-outlet-peer-outlet-id"><span data-i18n="net_outlet.peer_outlet">Peer Outlet</span></label>
          <select id="net-outlet-peer-outlet-id" name="peer_outlet_id">
            <option value="" data-i18n="net_outlet.select_peer_outlet">Select Peer Outlet</option>
          </select>
        </div>
        <div class="form-group" id="net-outlet-peer-device-port-group" style="display:none;">
          <label for="net-outlet-peer-device-port-id"><span data-i18n="net_outlet.peer_device_port">Peer Device Port</span></label>
          <select id="net-outlet-peer-device-port-id" name="peer_device_port_id">
            <option value="" data-i18n="net_outlet.select_peer_device_port">Select Peer Device Port</option>
          </select>
        </div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="net-outlet-modal" data-i18n="common.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" form="net-outlet-form" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
