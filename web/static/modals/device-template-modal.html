<template id="device-template-modal-template">
<div id="device-template-modal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="device-template-modal-title" data-i18n="device_template.add">Add Device Template</h3>
      <span class="close" data-modal-id="device-template-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <form id="device-template-form">
        <input type="hidden" id="device-template-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="device-template-name"><span data-i18n="device_template.name">Template Name</span><span class="required">*</span></label>
            <input type="text" id="device-template-name" name="name" autocomplete="off" required />
          </div>
          <div class="form-group">
            <label for="device-template-type" data-i18n="device_template.device_type">Device Type</label>
            <select id="device-template-type" name="device_type">
              <option value="other" data-i18n="device_type.other">Other</option>
              <option value="pc" data-i18n="device_type.pc">PC</option>
              <option value="laptop" data-i18n="device_type.laptop">Laptop</option>
              <option value="printer" data-i18n="device_type.printer">Printer</option>
              <option value="server" data-i18n="device_type.server">Server</option>
              <option value="network_device" data-i18n="device_type.network_device">Network Device</option>
              <option value="camera" data-i18n="device_type.camera">Camera</option>
              <option value="phone" data-i18n="device_type.phone">Phone</option>
              <option value="ap" data-i18n="device_type.ap">Access Point</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-template-brand" data-i18n="device_template.brand">Brand</label>
            <input type="text" id="device-template-brand" name="brand" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="device-template-model" data-i18n="device_template.model">Model</label>
            <input type="text" id="device-template-model" name="model" autocomplete="off" />
          </div>
        </div>
        <div class="form-group">
          <label for="device-template-description" data-i18n="common.description">Description</label>
          <textarea id="device-template-description" name="description" rows="3"></textarea>
        </div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="device-template-modal" data-i18n="common.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" form="device-template-form" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
