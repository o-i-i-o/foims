<template id="scheduled-task-modal-template">
<div id="scheduled-task-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="scheduled-task-modal-title">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="scheduled-task-modal-title" data-i18n="scheduled_tasks.create_task">Create Scheduled Task</h3>
      <button type="button" class="close" onclick="closeScheduledTaskModal()" aria-label="Close">&times;</button>
    </header>
    <form id="scheduled-task-form">
      <div class="modal-body">
        <input type="hidden" id="scheduled-task-id">
        <div class="form-group">
          <label for="scheduled-task-name"><span data-i18n="scheduled_tasks.name">Name</span><span class="required">*</span></label>
          <input type="text" id="scheduled-task-name" required>
        </div>
        <div class="form-group">
          <label for="scheduled-task-type"><span data-i18n="scheduled_tasks.type">Type</span><span class="required">*</span></label>
          <select id="scheduled-task-type" required>
            <option value="mac_sync" data-i18n="scheduled_tasks.task_types.mac_sync">MAC Address Sync</option>
            <option value="token_cleanup" data-i18n="scheduled_tasks.task_types.token_cleanup">Token Cleanup</option>
            <option value="backup" data-i18n="scheduled_tasks.task_types.backup">Database Backup</option>
            <option value="log_cleanup" data-i18n="scheduled_tasks.task_types.log_cleanup">Log Cleanup</option>
          </select>
        </div>
        <div class="form-group">
          <label for="scheduled-task-cron"><span data-i18n="scheduled_tasks.cron">Cron Expression</span><span class="required">*</span></label>
          <input type="text" id="scheduled-task-cron" value="0 */6 * * *" required>
          <small class="form-hint" data-i18n="scheduled_tasks.cron_hint">e.g., "0 */6 * * *" runs every 6 hours</small>
        </div>
        <div id="scheduled-task-config-section">
          <div class="form-group" id="mac-sync-config" style="display:none;">
            <label><span data-i18n="scheduled_tasks.config_fields.switch">Switch</span><span class="required">*</span></label>
            <select id="scheduled-task-switch-id">
              <option value="" data-i18n="scheduled_tasks.config_fields.select_switch">Select Switch</option>
            </select>
            <label style="margin-top:10px;"><span data-i18n="scheduled_tasks.config_fields.network">Network</span><span class="required">*</span></label>
            <select id="scheduled-task-network-id">
              <option value="" data-i18n="scheduled_tasks.config_fields.select_network">Select Network</option>
            </select>
          </div>
          <div class="form-group" id="log-cleanup-config" style="display:none;">
            <label><span data-i18n="scheduled_tasks.config_fields.keep_days">Keep Days</span></label>
            <input type="number" id="scheduled-task-keep-days" value="30" min="0">
            <small class="form-hint" data-i18n="scheduled_tasks.config_fields.keep_days_hint">Delete logs older than specified days, 0 means delete all</small>
          </div>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="scheduled-task-enabled" checked>
            <span data-i18n="scheduled_tasks.enabled">Enabled</span>
          </label>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" id="scheduled-task-cancel-btn" data-i18n="common.cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" data-i18n="common.save">Save</button>
      </footer>
    </form>
  </div>
</div>
</template>
