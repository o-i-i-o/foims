<template id="org-template-editor-modal-template">
<div id="org-template-editor-modal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="org-template-editor-modal-title" data-i18n="org_template.editor_title">Template Editor</h3>
      <span class="close" data-modal-id="org-template-editor-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <form id="org-template-editor-form">
        <input type="hidden" id="org-template-editor-id" />
        <div class="form-group">
          <label for="org-template-editor-name"><span data-i18n="common.name">Name</span><span class="required">*</span></label>
          <input type="text" id="org-template-editor-name" name="name" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label for="org-template-quick-fill" data-i18n="org_template.quick_fill">Quick Fill</label>
          <select id="org-template-quick-fill">
            <option value="" data-i18n="org_template.select_quick_fill">Select a preset...</option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="org_template.levels">Levels</label>
          <div id="org-template-editor-levels-container" class="org-template-levels-container"></div>
          <button type="button" id="org-template-add-level-btn" class="btn btn-sm btn-secondary" data-i18n="org_template.add_level">Add Level</button>
        </div>
        <div class="form-group">
          <label for="org-template-editor-description" data-i18n="common.description">Description</label>
          <textarea id="org-template-editor-description" name="description" rows="3"></textarea>
        </div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="org-template-editor-modal" data-i18n="common.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" form="org-template-editor-form" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
