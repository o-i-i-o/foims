<template id="room-modal-template">
<div class="modal-body">
  <form id="room-form">
    <input type="hidden" id="room-id">
    <div class="form-row">
      <div class="form-group">
        <label for="room-org-id"><span data-i18n="organization.parent_org">Organization Node</span></label>
        <select id="room-org-id" name="org_id">
          <option value="" data-i18n="organization.select_org">Select Organization Node</option>
        </select>
      </div>
      <div class="form-group">
        <label for="room-type"><span data-i18n="room.type">Room Type</span><span class="required">*</span></label>
        <select id="room-type" name="room_type" required>
          <option value="office" data-i18n="room.type_office">Office</option>
          <option value="lobby" data-i18n="room.type_lobby">Lobby</option>
          <option value="reception" data-i18n="room.type_reception">Reception</option>
          <option value="data_center" data-i18n="room.type_datacenter">Data Center</option>
          <option value="telecom_closet" data-i18n="room.type_telecom_closet">Telecom Closet</option>
          <option value="other" data-i18n="room.type_other">Other</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="room-name"><span data-i18n="room.name">Room Name</span><span class="required">*</span></label>
        <input type="text" id="room-name" name="name" autocomplete="off" required>
      </div>
      <div class="form-group power-inline">
        <label for="room-total-power" data-i18n="room.total_power">Power Supply</label>
        <div class="power-input-row">
          <input type="number" id="room-total-power" name="total_power_watts" min="0" step="any" autocomplete="off">
          <select id="room-power-unit-modal" class="form-control" aria-label="Unit">
            <option value="W">W</option>
            <option value="kW">kW</option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-group network-config-wrapper">
        <div class="list-header">
          <!-- 指向动态容器的分组标题：无控件可关联，改为语义中性的 span（.list-title） -->
          <span class="list-title" data-i18n="network.network_config">Network Config</span>
          <button type="button" id="room-add-network-config-btn" class="icon-btn btn-success list-add-btn" data-icon="plus" data-tooltip="Add" data-i18n-tooltip="network.add_network_config" aria-label="Add" data-i18n-aria-label="network.add_network_config"></button>
        </div>
        <div id="network-configs-container" class="dyn-list">
          <!-- 纯列标题：非表单控件标注，样式与机柜机位列头同款（.dyn-columns-header） -->
          <div class="dyn-columns-header" aria-hidden="true">
            <span data-i18n="network.region">Network Region</span>
            <span data-i18n="network.subnet">Subnet</span>
            <span class="dyn-columns-actions"></span>
          </div>
        </div>
    </div>
    <!-- 工位/机柜动态管理区域："其他"类型房间两者皆可管理 -->
    <div class="form-group" id="room-workstations-group">
        <div class="list-header">
          <span class="list-title" id="room-children-label" data-i18n="room.workstations">Workstations</span>
          <button type="button" id="add-room-workstation-btn" class="icon-btn btn-success list-add-btn" data-icon="plus" data-tooltip="Add Workstation" data-i18n-tooltip="room.add_workstation" aria-label="Add Workstation" data-i18n-aria-label="room.add_workstation"></button>
        </div>
        <div id="room-children-container" class="dyn-list">
          <!-- 纯列标题：非表单控件标注，样式与机柜机位列头同款（.dyn-columns-header） -->
          <div class="dyn-columns-header" aria-hidden="true">
            <span data-i18n="workstation.name">Workstation Name</span>
            <span data-i18n="workstation.manager">Manager</span>
            <span class="dyn-columns-actions"></span>
          </div>
        </div>
    </div>
    <div class="form-group hidden" id="room-cabinets-group">
        <div class="list-header">
          <span class="list-title" id="room-cabinets-label" data-i18n="room.cabinets">Cabinets</span>
          <button type="button" id="add-room-cabinet-btn" class="icon-btn btn-success list-add-btn" data-icon="plus" data-tooltip="Add Cabinet" data-i18n-tooltip="cabinet.add_cabinet" aria-label="Add Cabinet" data-i18n-aria-label="cabinet.add_cabinet"></button>
        </div>
        <div id="room-cabinets-container" class="dyn-list"></div>
    </div>
    <!-- 信息点动态管理区域（所有房型通用） -->
    <div class="form-group">
        <div class="list-header">
          <span class="list-title" id="room-net-outlets-label" data-i18n="room.net_outlets">Network Outlets</span>
          <button type="button" id="add-room-net-outlet-btn" class="icon-btn btn-success list-add-btn" data-icon="plus" data-tooltip="Add Network Outlet" data-i18n-tooltip="room.add_net_outlet" aria-label="Add Network Outlet" data-i18n-aria-label="room.add_net_outlet"></button>
        </div>
        <div id="room-net-outlets-container" class="dyn-list"></div>
    </div>
    <div class="form-group form-group-block">
      <textarea id="room-description" name="description" data-i18n-aria-label="common.description" data-i18n-placeholder="common.description_placeholder" placeholder="Enter description" aria-label="Description"></textarea>
    </div>
  </form>
</div>
<footer class="modal-footer">
  <button type="submit" class="btn btn-primary" form="room-form" data-i18n="common.save">Save</button>
</footer>
</template>
