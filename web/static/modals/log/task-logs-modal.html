<template id="task-logs-modal-template">
<div id="task-logs-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="task-logs-modal-title">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" id="task-logs-modal-title" data-i18n="scheduled_tasks.logs_title">Task Execution Logs</h3>
      <button type="button" class="close" data-modal-id="task-logs-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <table class="data-table">
        <thead>
          <tr>
            <th data-i18n="common.name">Name</th>
            <th data-i18n="common.status">Status</th>
            <th data-i18n="scheduled_tasks.execution_time">Execution Time</th>
            <th data-i18n="scheduled_tasks.duration">Duration(ms)</th>
            <th data-i18n="scheduled_tasks.details">Details</th>
          </tr>
        </thead>
        <tbody id="task-logs-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
</template>
