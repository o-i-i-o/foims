<template id="log-details-modal-template">
<div id="log-details-modal" class="modal modal-flex" role="dialog" aria-modal="true">
  <div class="modal-content modal-md">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="logs.detail_title">Log Details</h3>
      <button type="button" class="close" data-modal-id="log-details-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div class="log-detail-grid">
        <div class="log-detail-item">
          <label data-i18n="logs.operation_time">Operation Time</label>
          <div id="log-detail-time"></div>
        </div>
        <div class="log-detail-item">
          <label data-i18n="logs.operator">Operator</label>
          <div id="log-detail-user"></div>
        </div>
        <div class="log-detail-item">
          <label data-i18n="logs.operation_type">Operation Type</label>
          <div id="log-detail-type"></div>
        </div>
        <div class="log-detail-item">
          <label data-i18n="logs.result">Result</label>
          <div id="log-detail-result"></div>
        </div>
        <div class="log-detail-item">
          <label data-i18n="logs.resource_type">Resource Type</label>
          <div id="log-detail-resource-type"></div>
        </div>
        <div class="log-detail-item">
          <label data-i18n="logs.resource_id">Resource ID</label>
          <div id="log-detail-resource-id"></div>
        </div>
        <div class="log-detail-item">
          <label data-i18n="logs.ip_address">IP Address</label>
          <div id="log-detail-ip"></div>
        </div>
      </div>
      <div class="log-detail-section">
        <label data-i18n="logs.details">Details</label>
        <div id="log-detail-details"></div>
      </div>
    </div>
  </div>
</div>
</template>
