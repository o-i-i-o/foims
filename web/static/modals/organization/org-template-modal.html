<template id="org-template-modal-template">
<div id="org-template-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="org-template-modal-title">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="org-template-modal-title" data-i18n="org_template.title">Template Management</h3>
      <button type="button" class="close" data-modal-id="org-template-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div class="org-template-toolbar">
        <button type="button" id="org-template-add-btn" class="icon-btn btn-success" data-icon="plus" data-tooltip="Add Template" data-i18n-tooltip="org_template.add" aria-label="Add Template" data-i18n-aria-label="org_template.add"></button>
      </div>
      <div id="org-template-list" class="org-template-list"></div>
    </div>
  </div>
</div>
</template>
