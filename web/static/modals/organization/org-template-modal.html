<template id="org-template-modal-template">
<div id="org-template-modal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="org-template-modal-title" data-i18n="org_template.title">Template Management</h3>
      <span class="close" data-modal-id="org-template-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <div class="org-template-toolbar">
        <button type="button" id="org-template-add-btn" class="btn btn-primary btn-sm" data-i18n="org_template.add">Add Template</button>
      </div>
      <div id="org-template-list" class="org-template-list"></div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="org-template-modal" data-i18n="common.close">Close</button>
    </footer>
  </div>
</div>
</template>
