<template id="org-template-modal-template">
<div id="org-template-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="org-template-modal-title" data-i18n="org_template.title">Template Management</h3>
      <button type="button" class="close" data-modal-id="org-template-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div class="org-template-toolbar">
        <button type="button" id="org-template-add-btn" class="btn btn-primary btn-sm" data-i18n="org_template.add">Add Template</button>
      </div>
      <div id="org-template-list" class="org-template-list"></div>
    </div>
  </div>
</div>
</template>
