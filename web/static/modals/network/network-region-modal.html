<template id="network-region-modal-template">
<div class="modal-body">
  <form id="network-region-form">
    <input type="hidden" id="network-region-id">
    <div class="form-group">
      <label for="network-region-name"><span data-i18n="common.name">Name</span><span class="required">*</span></label>
      <input type="text" id="network-region-name" name="name" autocomplete="off" required aria-required="true">
    </div>
    <div class="form-row">
      <div class="form-group cidr-column">
        <!-- 指向动态容器的分组标题：无控件可关联，改为 span（.group-label，样式与原 label 一致） -->
        <span class="group-label" data-i18n="network.ipv4_cidrs">IPv4 CIDRs</span>
        <div id="network-region-ipv4-cidrs-list" class="cidr-input-list"></div>
      </div>
      <div class="form-group cidr-column">
        <span class="group-label" data-i18n="network.ipv6_cidrs">IPv6 CIDRs</span>
        <div id="network-region-ipv6-cidrs-list" class="cidr-input-list"></div>
      </div>
    </div>
    <div class="form-group form-group-block">
      <textarea id="network-region-description" name="description" data-i18n-aria-label="common.description" data-i18n-placeholder="common.description_placeholder" placeholder="Enter description" aria-label="Description"></textarea>
    </div>
  </form>
</div>
<footer class="modal-footer">
  <button type="submit" form="network-region-form" class="btn btn-primary" data-i18n="common.save">Save</button>
</footer>
</template>
