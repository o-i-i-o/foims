<template id="subnet-usage-modal-template">
<div id="subnet-usage-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="subnet-usage-modal-title">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" id="subnet-usage-modal-title" data-i18n="network.usage">Usage</h3>
      <button type="button" class="close" data-modal-id="subnet-usage-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div class="network-usage-container">
        <div class="usage-tabs" id="subnet-usage-tabs">
          <span class="usage-network-name" id="subnet-usage-network-name"></span>
          <div class="usage-tab-buttons" role="tablist">
            <button type="button" class="usage-tab-btn active" data-tab="ipv4" role="tab" aria-selected="true">IPv4</button>
            <button type="button" class="usage-tab-btn" data-tab="ipv6" role="tab" aria-selected="false">IPv6</button>
          </div>
        </div>
        <div id="subnet-usage-contents"></div>
      </div>
    </div>
  </div>
</div>
</template>
