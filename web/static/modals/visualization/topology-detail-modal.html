<template id="topology-detail-modal-template">
<div id="topology-detail-modal" class="topology-detail-modal">
  <div class="topology-detail-header">
    <h3 id="topology-detail-title"></h3>
    <button type="button" class="topology-detail-close" aria-label="Close">&times;</button>
  </div>
  <div class="topology-detail-tabs">
    <button type="button" class="toggle-ports active" data-panel="ports" data-i18n="visualization.show_ports">Show Ports</button>
    <button type="button" class="toggle-macs" data-panel="macs" data-i18n="visualization.show_macs">Show MACs</button>
    <button type="button" class="toggle-lldp" data-panel="lldp" data-i18n="visualization.show_lldp">Show LLDP</button>
  </div>
  <div class="topology-detail-body">
    <div class="topology-panel ports-panel"></div>
    <div class="topology-panel macs-panel" style="display:none"></div>
    <div class="topology-panel lldp-panel" style="display:none"></div>
  </div>
  <div class="topology-detail-footer">
    <button type="button" class="btn btn-danger btn-sm topology-remove-btn" data-i18n="visualization.remove_from_topology">Remove</button>
  </div>
</div>
</template>
