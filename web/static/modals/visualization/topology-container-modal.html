<template id="topology-container-modal-template">
<div id="topology-container-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="viz.container_coords">Container Coordinates</h3>
      <button type="button" class="close" data-modal-id="topology-container-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <p id="topology-container-name" class="form-hint"></p>
      <div class="form-row">
        <div class="form-group">
          <label for="topology-container-x" data-i18n="workstation.position_x">X Coordinate</label>
          <input type="number" id="topology-container-x" class="form-control" min="0" step="1">
        </div>
        <div class="form-group">
          <label for="topology-container-y" data-i18n="workstation.position_y">Y Coordinate</label>
          <input type="number" id="topology-container-y" class="form-control" min="0" step="1">
        </div>
      </div>
      <p class="hint-text" data-i18n="viz.container_coord_hint">Setting coordinates moves all devices inside the container together.</p>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="topology-container-modal" data-i18n="common.cancel">Cancel</button>
      <button type="button" id="topology-container-save-btn" class="btn btn-primary" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
