<template id="forgot-password-modal-template">
<div id="forgot-password-modal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="login.forgot_title">忘记密码</h3>
      <span class="close" data-modal-id="forgot-password-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <form id="forgot-password-form">
        <div class="form-group">
          <label for="forgot-email" data-i18n="login.forgot_email_label">请输入您的注册邮箱</label>
          <input
            type="email"
            id="forgot-email"
            name="email"
            required
            placeholder="请输入邮箱地址"
            data-i18n-placeholder="login.email_placeholder"
            aria-label="邮箱地址"
            data-i18n-aria-label="auth.email">
        </div>
        <div class="form-group">
          <small class="hint-text" data-i18n="login.forgot_hint">系统将向您的邮箱发送密码重置链接，请查收邮件。</small>
        </div>
        <div id="forgot-password-error" class="error-message" role="alert" aria-live="polite"></div>
        <div id="forgot-password-success" class="success-message" role="status" aria-live="polite"></div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="submit" class="btn btn-primary" form="forgot-password-form" data-i18n="login.send_reset_email">发送重置邮件</button>
    </footer>
  </div>
</div>
</template>
