<template id="device-port-detail-modal-template">
<div id="device-port-detail-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="device-port-detail-modal-title" data-i18n="device.port_detail">Port Detail</h3>
      <button type="button" class="close" data-modal-id="device-port-detail-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <form id="device-port-form-expanded">
        <input type="hidden" id="device-port-id-expanded">
        <input type="hidden" id="device-port-device-id-expanded">
        <div class="form-row">
          <div class="form-group">
            <label for="device-port-name-expanded"><span data-i18n="device.network_port_name">Port Name</span><span class="required">*</span></label>
            <input type="text" id="device-port-name-expanded" name="name" required autocomplete="off" placeholder="e.g., eth0, xg1/0/0/1">
          </div>
          <div class="form-group">
            <label for="device-port-ptype-expanded" data-i18n="device.physical_type">Physical Type</label>
            <select id="device-port-ptype-expanded" name="physical_type"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-port-role-expanded" data-i18n="device.interface_role">Interface Role</label>
            <select id="device-port-role-expanded" name="interface_role"></select>
          </div>
          <div class="form-group">
            <label for="device-port-vlan-expanded" data-i18n="device.vlan_id">VLAN ID</label>
            <input type="number" id="device-port-vlan-expanded" name="vlan_id" min="1" max="4094" autocomplete="off">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-port-mac-expanded" data-i18n="ip.mac_address">MAC Address</label>
            <input type="text" id="device-port-mac-expanded" name="mac_address" autocomplete="off" placeholder="00:11:22:33:44:55">
          </div>
          <div class="form-group form-group-inline">
            <label for="device-port-managed-expanded" data-i18n="device.device_managed" data-i18n-title="device.device_managed_hint" title="">Device Managed</label>
            <input type="checkbox" id="device-port-managed-expanded" name="device_managed" class="form-checkbox">
          </div>
        </div>
        <div class="form-group">
          <label for="device-port-description-expanded" data-i18n="common.description">Description</label>
          <textarea id="device-port-description-expanded" name="description" data-i18n-placeholder="common.description_placeholder" placeholder="Enter description"></textarea>
        </div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-danger" id="delete-port-btn" data-i18n="common.delete">Delete</button>
      <button type="button" class="btn btn-primary" id="save-port-btn" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
