<template id="lldp-modal-template">
<div id="lldp-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="lldp-modal-title">
  <div class="modal-content modal-xl">
    <header class="modal-header">
      <h3 class="modal-title" id="lldp-modal-title"><span data-i18n="device.lldp_neighbors">LLDP Neighbors</span> <span id="lldp-device-name"></span></h3>
      <button type="button" class="close" data-modal-id="lldp-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body modal-body-scroll">
      <!-- 加载中状态提示（非对话框）：用 status 角色向辅助技术播报 -->
      <div id="lldp-loading" class="modal-loading" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p class="loading-text" data-i18n="device.loading_lldp">Loading LLDP</p>
      </div>
      <div id="lldp-content" class="hidden"></div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-primary" id="sync-lldp-btn" data-i18n="device.sync_from_snmp">Sync from SNMP</button>
    </footer>
  </div>
</div>
</template>
