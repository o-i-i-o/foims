<template id="device-template-modal-template">
<div id="device-template-modal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="device-template-modal-title" data-i18n="device_template.title">Template Management</h3>
      <span class="close" data-modal-id="device-template-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <div id="device-template-list" class="device-template-list"></div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="device-template-modal" data-i18n="common.close">Close</button>
    </footer>
  </div>
</div>
</template>
