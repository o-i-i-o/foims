<template id="arp-modal-template">
<div id="arp-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content modal-xl">
    <header class="modal-header">
      <h3 class="modal-title"><span data-i18n="device.mac_table">MAC Table</span> <span id="arp-device-name"></span></h3>
      <button type="button" class="close" data-modal-id="arp-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body modal-body-scroll">
      <div id="arp-loading" class="modal-loading" role="dialog" aria-modal="true">
        <div class="spinner"></div>
        <p class="loading-text" data-i18n="device.loading_mac_table">Loading MAC table</p>
      </div>
      <div id="arp-content" class="hidden">
        <div class="tab-container">
          <div class="tab-toolbar">
            <div class="tab-buttons">
              <button type="button" class="tab-btn active" data-tab="ipv4">IPv4</button>
              <button type="button" class="tab-btn" data-tab="ipv6">IPv6</button>
            </div>
            <button type="button" class="btn btn-sm btn-primary" id="sync-mac-btn" data-i18n="device.sync_from_snmp">Sync from SNMP</button>
          </div>
          <div class="tab-content active" id="ipv4-tab">
            <input type="text" id="ipv4-search" class="tab-search" data-i18n-placeholder="device.search_ip_mac" placeholder="Search IP/MAC">
            <div id="ipv4-table-container" class="tab-table-container"></div>
          </div>
          <div class="tab-content" id="ipv6-tab">
            <input type="text" id="ipv6-search" class="tab-search" data-i18n-placeholder="device.search_ip_mac" placeholder="Search IP/MAC">
            <div id="ipv6-table-container" class="tab-table-container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</template>
