<template id="port-conflict-modal-template">
<div id="port-conflict-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="port-conflict-modal-title" data-i18n="device.conflict_title">端口名称冲突</h3>
      <button type="button" class="close" data-modal-id="port-conflict-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div class="port-conflict-summary" id="port-conflict-summary"></div>
      <div class="port-conflict-list" id="port-conflict-list"></div>
      <div class="port-conflict-actions">
        <button type="button" class="icon-btn btn-secondary" id="conflict-skip-all-btn" data-icon="x" data-tooltip="Skip All" data-i18n-tooltip="device.conflict_skip_all" aria-label="Skip All" data-i18n-aria-label="device.conflict_skip_all"></button>
        <button type="button" class="icon-btn btn-edit" id="conflict-overwrite-all-btn" data-icon="edit" data-tooltip="Overwrite All" data-i18n-tooltip="device.conflict_overwrite_all" aria-label="Overwrite All" data-i18n-aria-label="device.conflict_overwrite_all"></button>
      </div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-primary" id="conflict-confirm-btn" data-i18n="device.conflict_confirm">确认</button>
    </footer>
  </div>
</div>
</template>
