<template id="port-conflict-modal-template">
<div id="port-conflict-modal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="port-conflict-modal-title" data-i18n="device.conflict_title">端口名称冲突</h3>
      <span class="close" data-modal-id="port-conflict-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <div class="port-conflict-summary" id="port-conflict-summary"></div>
      <div class="port-conflict-list" id="port-conflict-list"></div>
      <div class="port-conflict-actions">
        <button type="button" class="btn btn-sm btn-secondary" id="conflict-skip-all-btn" data-i18n="device.conflict_skip_all">全部跳过</button>
        <button type="button" class="btn btn-sm btn-secondary" id="conflict-overwrite-all-btn" data-i18n="device.conflict_overwrite_all">全部覆盖</button>
      </div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-primary" id="conflict-confirm-btn" data-i18n="device.conflict_confirm">确认</button>
    </footer>
  </div>
</div>
</template>
