<template id="device-ports-group-modal-template">
<div id="device-ports-group-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content modal-lg-custom">
    <header class="modal-header">
      <h3 class="modal-title" id="device-ports-group-modal-title" data-i18n="device.port_groups">Port Groups</h3>
      <button type="button" class="close" data-modal-id="device-ports-group-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div class="port-groups-container"></div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-primary" id="add-port-btn" data-i18n="device.add_port">Add Port</button>
      <button type="button" class="btn btn-secondary" id="get-snmp-ports-btn" data-i18n="device.get_snmp_ports">Get Ports from SNMP</button>
    </footer>
  </div>
</div>
</template>
