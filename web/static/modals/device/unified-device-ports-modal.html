<template id="unified-device-ports-modal-template">
<div id="unified-device-ports-modal" class="modal">
  <div class="modal-content modal-lg-custom">
    <header class="modal-header">
      <h3 class="modal-title" id="unified-device-ports-modal-title" data-i18n="device.unified_ports">Device Ports</h3>
      <span class="close" data-modal-id="unified-device-ports-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <!-- 端口分组容器（5月版布局：NIC 接口与二层端口都作为分组渲染于此） -->
      <div class="port-groups-container"></div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-primary" id="add-port-btn" data-i18n="device.add_device_port">添加端口</button>
      <button type="button" class="btn btn-secondary" id="get-snmp-ports-btn" data-i18n="device.sync_snmp_ports">从SNMP获取端口</button>
    </footer>
  </div>
</div>
</template>
