<template id="room-net-outlets-list-modal-template">
<div id="room-net-outlets-list-modal" class="modal">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" id="room-net-outlets-list-modal-title" data-i18n="room.net_outlets_list">Network Outlets List</h3>
      <span class="close" data-modal-id="room-net-outlets-list-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <div class="table-container">
        <table id="room-net-outlets-list-table" class="data-table">
          <thead>
            <tr>
              <th data-i18n="common.index">No.</th>
              <th data-i18n="common.name">Name</th>
              <th data-i18n="net_outlet.type">Type</th>
              <th data-i18n="net_outlet.cabinet">Cabinet</th>
            </tr>
          </thead>
          <tbody id="room-net-outlets-list-tbody">
            <tr class="empty-row">
              <td colspan="4" class="text-center" data-i18n="common.no_data">No data available</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="room-net-outlets-list-modal" data-i18n="common.close">Close</button>
    </footer>
  </div>
</div>
</template>
