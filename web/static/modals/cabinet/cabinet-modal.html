<template id="cabinet-modal-template">
<div id="cabinet-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" id="cabinet-modal-title" data-i18n="cabinet.add_cabinet">Add Cabinet</h3>
      <button type="button" class="close" data-modal-id="cabinet-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <form id="cabinet-form">
        <input type="hidden" id="cabinet-id">
        <div class="form-row">
          <div class="form-group">
            <label for="cabinet-room"><span data-i18n="cabinet.room">Room</span><span class="required">*</span></label>
            <select id="cabinet-room" name="room_id" required>
              <option value="" data-i18n="cabinet.select_room">Select Room</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cabinet-name"><span data-i18n="cabinet.name">Cabinet Name</span><span class="required">*</span></label>
            <input type="text" id="cabinet-name" name="name" autocomplete="off" required>
          </div>
          <div class="form-group">
            <label for="cabinet-capacity"><span data-i18n="cabinet.capacity">Capacity (U)</span><span class="required">*</span></label>
            <input type="number" id="cabinet-capacity" name="capacity" min="1" max="45" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label data-i18n="cabinet.inherited_networks">Inherited Networks</label>
            <div id="cabinet-inherited-networks">
              <p class="text-muted" data-i18n="cabinet.inherited_networks_hint">Select a room to inherit its network configuration</p>
            </div>
          </div>
        </div>
        <!-- 机位动态管理区域 -->
        <div class="form-row">
          <div class="form-group">
            <div class="list-header">
              <label id="cabinet-positions-label" data-i18n="cabinet.positions">Positions</label>
              <button type="button" id="add-position-row-btn" class="btn btn-secondary btn-sm list-add-btn" data-i18n="cabinet.add_position">Add Position</button>
            </div>
            <div id="cabinet-positions-container"></div>
          </div>
        </div>
        <!-- 配线架动态管理区域（参照房间信息点逻辑） -->
        <div class="form-row">
          <div class="form-group">
            <div class="list-header">
              <label id="cabinet-patch-panels-label" data-i18n="cabinet.patch_panels">Patch Panels</label>
              <button type="button" id="add-patch-panel-row-btn" class="btn btn-secondary btn-sm list-add-btn" data-i18n="cabinet.add_patch_panel">Add Patch Panel</button>
            </div>
            <div id="cabinet-patch-panels-container"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="cabinet-description" data-i18n="common.description">Description</label>
          <textarea id="cabinet-description" name="description" data-i18n-placeholder="common.description_placeholder" placeholder="Enter description"></textarea>
        </div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="submit" class="btn btn-primary" form="cabinet-form" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
