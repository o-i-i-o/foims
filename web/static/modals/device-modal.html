<template id="device-modal-template">
<div id="device-modal" class="modal">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" id="device-modal-title" data-i18n="device.add">Add Device</h3>
      <span class="close" data-modal-id="device-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <form id="device-form">
        <input type="hidden" id="device-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="device-name"><span data-i18n="device.name">Device Name</span><span class="required">*</span></label>
            <input type="text" id="device-name" name="name" autocomplete="off" required />
          </div>
          <div class="form-group">
            <label for="device-type" data-i18n="device.device_type">Device Type</label>
            <select id="device-type" name="device_type">
              <option value="other" data-i18n="device_type.other">Other</option>
              <option value="pc" data-i18n="device_type.pc">PC</option>
              <option value="laptop" data-i18n="device_type.laptop">Laptop</option>
              <option value="printer" data-i18n="device_type.printer">Printer</option>
              <option value="server" data-i18n="device_type.server">Server</option>
              <option value="network_device" data-i18n="device_type.network_device">Network Device</option>
              <option value="switch" data-i18n="device_type.switch">Switch</option>
              <option value="camera" data-i18n="device_type.camera">Camera</option>
              <option value="phone" data-i18n="device_type.phone">Phone</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-template-id" data-i18n="device.template">Template</label>
            <select id="device-template-id" name="template_id">
              <option value="" data-i18n="device.select_template">Select Template</option>
            </select>
          </div>
          <div class="form-group" style="display: flex; align-items: center; gap: 8px; padding-top: 0.85rem;">
            <label for="device-save-as-template" data-i18n="device.save_as_template" style="margin: 0; min-width: auto; padding-top: 0;">Save as Template</label>
            <input type="checkbox" id="device-save-as-template" name="save_as_template" style="width: 16px; height: 16px; min-width: 16px; margin: 0; flex-shrink: 0;" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-serial-number" data-i18n="device.serial_number">Serial Number</label>
            <input type="text" id="device-serial-number" name="serial_number" autocomplete="off" />
          </div>
          <div class="form-group" id="device-template-name-group" style="display: none;">
            <label for="device-template-name" data-i18n="device.template_name">Template Name</label>
            <input type="text" id="device-template-name" name="template_name" autocomplete="off" placeholder="" data-i18n-placeholder="device.template_name_placeholder" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-brand" data-i18n="device.brand">Brand</label>
            <input type="text" id="device-brand" name="brand" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="device-model" data-i18n="device.model">Model</label>
            <input type="text" id="device-model" name="model" autocomplete="off" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-vendor" data-i18n="device.vendor">Vendor</label>
            <input type="text" id="device-vendor" name="vendor" autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="device-location" data-i18n="device.location">Location</label>
            <input type="text" id="device-location" name="location" autocomplete="off" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="device-room-id" data-i18n="device.room">Room</label>
            <select id="device-room-id" name="room_id">
              <option value="" data-i18n="device.select_room">Select Room</option>
            </select>
          </div>
          <div class="form-group">
            <label for="device-workstation-id" data-i18n="device.workstation">Workstation</label>
            <select id="device-workstation-id" name="workstation_id">
              <option value="" data-i18n="device.select_workstation">Select Workstation</option>
            </select>
          </div>
          <div class="form-group">
            <label for="device-position-id" data-i18n="device.position">Cabinet Position</label>
            <select id="device-position-id" name="position_id">
              <option value="" data-i18n="device.select_position">Select Position</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="device-description" data-i18n="common.description">Description</label>
          <textarea id="device-description" name="description" rows="3"></textarea>
        </div>
        <hr class="section-divider" />
        <h4 class="section-subtitle" data-i18n="device.network_card_config">Network Card Management</h4>
        <div id="device-network-cards-container"></div>
        <div class="network-card-actions">
          <button type="button" id="add-network-card-btn" class="btn btn-secondary btn-sm" data-i18n="device.add_network_card">Add Network Card</button>
        </div>
        <hr class="section-divider" />
        <h4 class="section-subtitle" data-i18n="device.snmp_config">SNMP Configuration</h4>
        <div class="form-row">
          <div class="form-group">
            <label for="device-snmp-version" data-i18n="device.snmp_version">SNMP Version</label>
            <select id="device-snmp-version" name="snmp_version">
	              <option value="v2c" data-i18n="device.snmp_v2c">SNMPv1/v2c</option>
	              <option value="v3" data-i18n="device.snmp_v3">SNMPv3</option>
	            </select>
          </div>
          <div class="form-group">
            <label for="device-snmp-port" data-i18n="device.snmp_port">SNMP Port</label>
            <input type="number" id="device-snmp-port" name="snmp_port" value="161" autocomplete="off" />
          </div>
        </div>
        <div class="form-row" id="snmp-v2c-config">
          <div class="form-group flex-1">
            <label for="device-snmp-community" data-i18n="device.snmp_community">Community String</label>
            <input type="text" id="device-snmp-community" name="snmp_community" placeholder="public" autocomplete="off" />
          </div>
        </div>
        <div id="snmp-v3-config" class="hidden">
          <div class="form-row">
            <div class="form-group">
              <label for="device-snmp-username" data-i18n="device.snmp_username">Username</label>
              <input type="text" id="device-snmp-username" name="snmp_username" autocomplete="off" />
            </div>
            <div class="form-group">
              <label for="device-snmp-auth-protocol" data-i18n="device.snmp_auth_protocol">Auth Protocol</label>
              <select id="device-snmp-auth-protocol" name="snmp_auth_protocol">
                <option value="" data-i18n="device.snmp_no_auth">No Auth</option>
                <option value="MD5">MD5</option>
                <option value="SHA">SHA</option>
                <option value="SHA-224">SHA-224</option>
                <option value="SHA-256">SHA-256</option>
                <option value="SHA-384">SHA-384</option>
                <option value="SHA-512">SHA-512</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="device-snmp-auth-password" data-i18n="device.snmp_auth_password">Auth Password</label>
              <input type="password" id="device-snmp-auth-password" name="snmp_auth_password" autocomplete="off" />
            </div>
            <div class="form-group">
              <label for="device-snmp-priv-protocol" data-i18n="device.snmp_priv_protocol">Privacy Protocol</label>
              <select id="device-snmp-priv-protocol" name="snmp_priv_protocol">
                <option value="" data-i18n="device.snmp_no_priv">No Privacy</option>
                <option value="DES">DES</option>
                <option value="AES">AES</option>
                <option value="AES-128">AES-128</option>
                <option value="AES-192">AES-192</option>
                <option value="AES-256">AES-256</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="device-snmp-priv-password" data-i18n="device.snmp_priv_password">Privacy Password</label>
              <input type="password" id="device-snmp-priv-password" name="snmp_priv_password" autocomplete="off" />
            </div>
            <div class="form-group"></div>
          </div>
        </div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="button" id="test-snmp-btn" class="btn btn-secondary" data-i18n="device.test_snmp">Test SNMP</button>
      <button type="button" id="get-snmp-info-btn" class="btn btn-primary" data-i18n="device.get_snmp_info">Get Info from SNMP</button>
      <button type="button" class="btn btn-secondary" data-modal-id="device-modal" data-i18n="common.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" form="device-form" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
