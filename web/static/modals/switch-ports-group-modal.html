<template id="switch-ports-group-modal-template">
<div id="switch-ports-group-modal" class="modal">
  <div class="modal-content modal-lg-custom">
    <header class="modal-header">
      <h3 class="modal-title" id="switch-ports-group-modal-title" data-i18n="switch.port_groups">Port Groups</h3>
      <span class="close" data-modal-id="switch-ports-group-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <div class="port-groups-container"></div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-primary" id="add-port-btn" data-i18n="switch.add_port">Add Port</button>
      <button type="button" class="btn btn-secondary" id="get-snmp-ports-btn" data-i18n="switch.get_snmp_ports">Get Ports from SNMP</button>
      <button type="button" class="btn btn-secondary" data-modal-id="switch-ports-group-modal" data-i18n="common.close">Close</button>
    </footer>
  </div>
</div>
</template>
