<template id="pull-mac-modal-template">
<div class="modal-body">
  <form id="pull-mac-form">
    <div class="form-row">
      <div class="form-group">
        <label for="pull-mac-device-select" data-i18n="ip.select_device">Select Device</label>
        <select id="pull-mac-device-select" name="device_id" aria-label="Target device"></select>
      </div>
      <div class="form-group">
        <label for="pull-mac-network-select" data-i18n="ip.select_network">Select Network</label>
        <select id="pull-mac-network-select" name="subnet_id" aria-label="Target network"></select>
      </div>
    </div>
  </form>
</div>
<footer class="modal-footer">
  <button type="submit" class="btn btn-primary" form="pull-mac-form" id="pull-ip-btn" data-i18n="common.confirm">Confirm</button>
</footer>
</template>
