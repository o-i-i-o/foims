<template id="simple-list-modal-template">
<div id="simple-list-modal" class="modal">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" id="simple-list-modal-title"></h3>
      <span class="close" data-modal-id="simple-list-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <div class="table-container">
        <table id="simple-list-table" class="data-table">
          <thead>
            <tr id="simple-list-thead-tr"></tr>
          </thead>
          <tbody id="simple-list-tbody"></tbody>
        </table>
      </div>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="simple-list-modal" data-i18n="common.close">Close</button>
    </footer>
  </div>
</div>
</template>
