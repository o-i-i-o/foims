<template id="simple-list-modal-template">
<div id="simple-list-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" id="simple-list-modal-title"></h3>
      <button type="button" class="close" data-modal-id="simple-list-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div class="table-container">
        <table id="simple-list-table" class="data-table">
          <thead>
            <tr id="simple-list-thead-tr"></tr>
          </thead>
          <tbody id="simple-list-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</template>
