<template id="confirm-modal-template">
<div id="confirm-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content modal-sm">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="common.confirm">Confirm</h3>
      <button type="button" class="close" id="confirm-close" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <p id="confirm-message"></p>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" id="confirm-cancel" data-i18n="common.cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="confirm-ok" data-i18n="common.confirm">Confirm</button>
    </footer>
  </div>
</div>
</template>
