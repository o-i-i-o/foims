<template id="agent-detail-modal-template">
<div class="modal-body">
  <!-- 头部概要：状态徽章 + IP（主机名写入标题栏，见 modalLoader 注册表 titleHtml） -->
  <div class="agent-detail-summary">
    <span id="agent-detail-status-badge" class="status-badge agent-detail-badge">-</span>
    <span id="agent-detail-ip" class="agent-detail-ip"></span>
  </div>

  <!-- 分组卡片网格：系统信息 / CPU / 内存 / 磁盘 / 网络 / 温度风扇 -->
  <div class="agent-detail-groups">
    <section class="agent-detail-card">
      <h4 class="agent-detail-card-title" data-i18n="agents.group_system">系统信息</h4>
      <dl class="agent-kv">
        <dt data-i18n="agents.label_os">操作系统</dt><dd id="agent-detail-os">-</dd>
        <dt data-i18n="agents.label_kernel">内核</dt><dd id="agent-detail-kernel">-</dd>
        <dt data-i18n="agents.label_arch">架构</dt><dd id="agent-detail-arch">-</dd>
        <dt data-i18n="agents.label_uptime">运行时长</dt><dd id="agent-detail-uptime">-</dd>
        <dt data-i18n="agents.label_version">Agent 版本</dt><dd id="agent-detail-version">-</dd>
        <dt data-i18n="agents.label_machine_id">机器标识</dt><dd id="agent-detail-machine-id">-</dd>
        <dt data-i18n="agents.label_collected_at">上报时刻</dt><dd id="agent-detail-collected-at">-</dd>
      </dl>
    </section>

    <section class="agent-detail-card">
      <h4 class="agent-detail-card-title" data-i18n="agents.group_cpu">CPU</h4>
      <div class="agent-cpu-big" id="agent-detail-cpu">-</div>
      <dl class="agent-kv">
        <dt data-i18n="agents.label_load">负载 (1/5/15min)</dt><dd id="agent-detail-cpu-load">-</dd>
        <dt data-i18n="agents.label_cores">逻辑核数</dt><dd id="agent-detail-cpu-cores">-</dd>
      </dl>
    </section>

    <section class="agent-detail-card">
      <h4 class="agent-detail-card-title" data-i18n="agents.group_memory">内存</h4>
      <div id="agent-detail-mem-bar" class="agent-mem-bar"></div>
      <dl class="agent-kv">
        <dt data-i18n="agents.label_total">总量</dt><dd id="agent-detail-mem-total">-</dd>
        <dt data-i18n="agents.label_used">已用</dt><dd id="agent-detail-mem-used">-</dd>
        <dt data-i18n="agents.label_swap">交换分区（已用/总量）</dt><dd id="agent-detail-mem-swap">-</dd>
      </dl>
    </section>

    <section class="agent-detail-card agent-detail-card-wide">
      <h4 class="agent-detail-card-title" data-i18n="agents.group_disk">磁盘</h4>
      <div id="agent-detail-disks" class="agent-rows"></div>
    </section>

    <section class="agent-detail-card">
      <h4 class="agent-detail-card-title" data-i18n="agents.group_network">网络</h4>
      <div id="agent-detail-nets" class="agent-rows"></div>
    </section>

    <section class="agent-detail-card">
      <h4 class="agent-detail-card-title" data-i18n="agents.group_sensors">温度 / 风扇</h4>
      <div id="agent-detail-sensors" class="agent-rows"></div>
    </section>
  </div>

  <!-- 近 24 小时迷你曲线（2×2，SVG 自绘） -->
  <h4 class="agent-spark-heading" data-i18n="agents.chart_heading">近 24 小时趋势</h4>
  <div class="agent-spark-grid">
    <div class="agent-spark-card">
      <h5 data-i18n="agents.chart_cpu">CPU 使用率</h5>
      <div id="agent-chart-cpu" class="agent-spark-box"></div>
    </div>
    <div class="agent-spark-card">
      <h5 data-i18n="agents.chart_memory">内存</h5>
      <div id="agent-chart-memory" class="agent-spark-box"></div>
    </div>
    <div class="agent-spark-card">
      <h5 data-i18n="agents.chart_disk">磁盘</h5>
      <div id="agent-chart-disk" class="agent-spark-box"></div>
    </div>
    <div class="agent-spark-card">
      <h5 data-i18n="agents.chart_temp">温度</h5>
      <div id="agent-chart-temp" class="agent-spark-box"></div>
    </div>
  </div>
</div>

</template>
