<template id="change-password-modal-template">
<div id="change-password-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="change-password-modal-title">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="auth.change_password" id="change-password-modal-title">Change Password</h3>
      <button type="button" class="close" data-modal-id="change-password-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <form id="change-password-form">
        <div class="form-group">
          <label for="change-password-old">
            <span data-i18n="auth.old_password">Current Password</span><span class="required">*</span>
          </label>
          <input type="password" id="change-password-old" name="old_password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
          <label for="change-password-new">
            <span data-i18n="auth.new_password">New Password</span><span class="required">*</span>
          </label>
          <input type="password" id="change-password-new" name="new_password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
          <label for="change-password-confirm">
            <span data-i18n="auth.confirm_password">Confirm New Password</span><span class="required">*</span>
          </label>
          <input type="password" id="change-password-confirm" name="confirm_password" autocomplete="new-password" minlength="8" required>
        </div>
        <span class="hint-text" data-i18n="auth.change_password_hint">After a successful change you will be logged out on all devices and need to sign in again; the new password must follow the password policy and must not reuse recent passwords</span>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="submit" class="btn btn-primary" form="change-password-form" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
