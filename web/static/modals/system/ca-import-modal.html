<template id="ca-import-modal-template">
<div id="ca-import-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="cert.ca_import_title">Import Root CA</h3>
      <button type="button" class="close" data-modal-id="ca-import-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <form id="ca-import-form">
        <div class="form-group">
          <label for="ca-file">
            <span data-i18n="cert.ca_cert_file">CA Certificate File (PEM format)</span><span class="required">*</span>
          </label>
          <input type="file" id="ca-file" name="ca_file" accept=".pem,.crt,.cer" required>
        </div>
        <div class="form-group">
          <label for="ca-key-file">
            <span data-i18n="cert.ca_key_file">CA Private Key File (PEM format)</span><span class="required">*</span>
          </label>
          <input type="file" id="ca-key-file" name="ca_key_file" accept=".pem,.key" required>
        </div>
        <span class="hint-text" data-i18n="cert.ca_import_hint">Import an existing CA certificate and its private key so this site can issue certificates under that CA. The CA private key never leaves the server</span>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="submit" class="btn btn-primary" form="ca-import-form" data-i18n="cert.ca_import">Import Root CA</button>
    </footer>
  </div>
</div>
</template>
