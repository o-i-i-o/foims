<template id="two-factor-modal-template">
<div id="two-factor-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="two_factor.title">Two-Factor Authentication Setup</h3>
      <button type="button" class="close" data-modal-id="two-factor-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <div id="two-factor-setup-step">
        <p class="hint-text" data-i18n="two_factor.scan_hint">Scan the QR code below with your authenticator app, or enter the key manually:</p>
        <div class="qr-code-container">
          <!-- src 由 userManager.js 打开时以 data URI 动态填充，初始留空避免对当前页发起无效请求 -->
          <img id="two-factor-qr-code" alt="2FA QR Code">
        </div>
        <div class="form-group">
          <label for="two-factor-secret" data-i18n="two_factor.secret_key">Secret Key</label>
          <input type="text" id="two-factor-secret" readonly value="" aria-label="2FA secret key">
          <input type="hidden" id="two-factor-uri" value="">
        </div>
        <div class="form-group">
          <label for="two-factor-verify-code" data-i18n="two_factor.verify_code">Verification Code</label>
          <input type="text" id="two-factor-verify-code" maxlength="6" data-i18n-placeholder="two_factor.verify_code_placeholder" placeholder="Enter 6-digit code" aria-label="2FA verification code">
        </div>
        <div id="two-factor-error" class="error-message" role="alert" aria-live="polite"></div>
        <div id="two-factor-success" class="success-message" role="status" aria-live="polite"></div>
      </div>
      <div id="two-factor-manage-step" class="hidden">
        <p class="hint-text" data-i18n="two_factor.enabled_hint">Two-factor authentication is enabled for your account</p>
        <div class="form-group">
          <label for="two-factor-disable-code" data-i18n="two_factor.verify_code">Verification Code</label>
          <input type="text" id="two-factor-disable-code" maxlength="6" data-i18n-placeholder="two_factor.disable_code_placeholder" placeholder="Enter 6-digit code to disable 2FA" aria-label="Disable 2FA code">
        </div>
        <div id="two-factor-disable-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>
    </div>
    <footer class="modal-footer">
      <button type="button" id="two-factor-enable-btn" class="btn btn-primary" data-i18n="two_factor.enable">Enable 2FA</button>
      <button type="button" id="two-factor-disable-btn" class="btn btn-danger hidden" data-i18n="two_factor.disable">Disable 2FA</button>
    </footer>
  </div>
</div>
</template>
