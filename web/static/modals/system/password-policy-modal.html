<template id="password-policy-modal-template">
<div id="password-policy-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="config.password_policy">Password Policy</h3>
      <button type="button" class="close" data-modal-id="password-policy-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <form id="password-policy-form">
        <div class="form-row">
          <div class="form-group">
            <label for="password-policy-min-length" data-i18n="config.password_min_length">Minimum Length</label>
            <input type="number" id="password-policy-min-length" class="form-control" min="8" max="128">
          </div>
          <div class="form-group">
            <label for="password-policy-expiry" data-i18n="config.password_expiry">Validity Period (days, 0 = disabled)</label>
            <input type="number" id="password-policy-expiry" class="form-control" min="0" max="36500">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password-policy-history" data-i18n="config.password_history">History Check (recent N, 0 = disabled)</label>
            <input type="number" id="password-policy-history" class="form-control" min="0" max="24">
          </div>
          <div class="form-group"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="password-policy-upper" class="form-checkbox" />
              <span data-i18n="config.password_require_upper">Require uppercase letters</span>
            </label>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="password-policy-lower" class="form-checkbox" />
              <span data-i18n="config.password_require_lower">Require lowercase letters</span>
            </label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="password-policy-digit" class="form-checkbox" />
              <span data-i18n="config.password_require_digit">Require digits</span>
            </label>
          </div>
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="password-policy-special" class="form-checkbox" />
              <span data-i18n="config.password_require_special">Require special characters</span>
            </label>
          </div>
        </div>
      </form>
    </div>
    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-id="password-policy-modal" data-i18n="common.cancel">Cancel</button>
      <button type="button" id="password-policy-save-btn" class="btn btn-primary" data-i18n="common.save">Save</button>
    </footer>
  </div>
</div>
</template>
