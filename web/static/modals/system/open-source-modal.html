<template id="open-source-modal-template">
<div id="open-source-modal" class="modal">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="system.open_source_components">Open Source Components</h3>
      <span class="close" data-modal-id="open-source-modal" role="button" tabindex="0" aria-label="Close">&times;</span>
    </header>
    <div class="modal-body">
      <p class="open-source-intro" data-i18n="system.open_source_intro">
        This project is licensed under GPL-3.0-or-later and uses the following open source components.
      </p>
      <div id="open-source-list" class="open-source-list"></div>
    </div>
  </div>
</div>
</template>
