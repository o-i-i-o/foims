<template id="open-source-modal-template">
<div id="open-source-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="open-source-modal-title">
  <div class="modal-content modal-lg">
    <header class="modal-header">
      <h3 class="modal-title" data-i18n="system.open_source_components" id="open-source-modal-title">Open Source Components</h3>
      <button type="button" class="close" data-modal-id="open-source-modal" aria-label="Close">&times;</button>
    </header>
    <div class="modal-body">
      <p class="open-source-intro" data-i18n="system.open_source_intro">
        This project is licensed under GPL-3.0-or-later and uses the following open source components.
      </p>
      <div id="open-source-list" class="open-source-list"></div>
    </div>
  </div>
</div>
</template>
