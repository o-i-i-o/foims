[package]
name = "foims-agent-windows"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FOIMS Agent（Windows）：windows_exporter 采集器移植 + HTTP/3 mTLS 上报"

# 二进制名与 Linux 版统一为 foims-agent（windows 目标构建时 cargo 自动追加
# .exe），build-agent.sh 归集与服务端组包的产物名两侧一致
[[bin]]
name = "foims-agent"
path = "src/main.rs"

[dependencies]
# 平台无关框架（采集器 trait/抓取编排/上报 transport）
foims-agent-core = { workspace = true }
# 上报协议类型（与主仓 foims-common 同步的双副本）
foims-protocol = { workspace = true }

# RFC3339 时刻（collected_at）
chrono = { workspace = true }

# 上报模式异步运行时（与 Linux 版一致的 Reporter 调度）
tokio = { workspace = true }

serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# MachineGuid 读取失败时的回退机器标识
uuid = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Win32 FFI（PDH 性能计数器/注册表/SCM/系统信息/文件系统卷信息/进程时间）；仅 windows 目标启用
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
# FfiError 派生 Display/Error
thiserror = { workspace = true }

[dev-dependencies]
# 纯逻辑单测的临时构造
tempfile = "3"

[lints]
workspace = true
