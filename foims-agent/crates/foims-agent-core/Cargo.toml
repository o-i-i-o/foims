[package]
name = "foims-agent-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FOIMS Agent 平台无关层：指标模型、采集器框架与 HTTP/3 mTLS 上报 transport"

[dependencies]
# 上报协议类型（与主仓 foims-common 同步的双副本）
foims-protocol = { workspace = true }

# HTTP/3 mTLS 上报链路（quinn+rustls-ring 纯用户态，musl 静态友好，无 OpenSSL）
bytes = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }

# agent.toml 配置解析
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 上报间隔 ±10% 抖动
rand = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
