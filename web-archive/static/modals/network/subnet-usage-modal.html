<template id="subnet-usage-modal-template">
<div class="modal-body">
  <div class="network-usage-container">
    <div class="usage-tabs" id="subnet-usage-tabs">
      <span class="usage-network-name" id="subnet-usage-network-name"></span>
      <div class="usage-tab-buttons" role="tablist">
        <button type="button" class="usage-tab-btn active" data-tab="ipv4" role="tab" aria-selected="true" aria-controls="ipv4-content" id="subnet-usage-ipv4-btn">IPv4</button>
        <button type="button" class="usage-tab-btn" data-tab="ipv6" role="tab" aria-selected="false" aria-controls="ipv6-content" id="subnet-usage-ipv6-btn">IPv6</button>
      </div>
    </div>
    <div id="subnet-usage-contents"></div>
  </div>
</div>

</template>
