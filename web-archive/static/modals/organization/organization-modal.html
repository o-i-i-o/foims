<template id="organization-modal-template">
<div class="modal-body">
  <form id="organization-form">
    <input type="hidden" id="org-id">
    <input type="hidden" id="org-parent-id">
    <div id="org-template-select-container" class="form-group hidden">
      <label for="org-template-select"><span data-i18n="org_template.select_template">Select Template</span><span class="required">*</span></label>
      <select id="org-template-select" name="template_id">
        <option value="" data-i18n="org_template.select_template">Select Template</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="org-name"><span data-i18n="common.name">Name</span><span class="required">*</span></label>
        <input type="text" id="org-name" name="name" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label for="org-type"><span data-i18n="organization.type">Type</span><span class="required">*</span></label>
        <select id="org-type" name="org_type" required>
          <option value="" data-i18n="organization.select_type">Select Type</option>
        </select>
      </div>
    </div>
    <div class="form-group form-group-block">
      <textarea id="org-description" name="description" data-i18n-aria-label="common.description" data-i18n-placeholder="common.description_placeholder" placeholder="Enter description" aria-label="Description"></textarea>
    </div>
    <div id="org-parent-info" class="org-parent-info hidden">
      <p><span data-i18n="organization.parent">Parent</span>: <strong id="org-parent-name"></strong> (<span id="org-parent-type"></span>)</p>
    </div>
  </form>
</div>
<footer class="modal-footer">
  <button type="submit" class="btn btn-primary" form="organization-form" data-i18n="common.save">Save</button>
</footer>
</template>
